<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>PULSO — Entrena y mide tu progreso</title>
<meta name="description" content="Registra tus entrenamientos de gym y de casa. Rutinas, series, descansos y progreso a todo color.">
<meta name="theme-color" content="#F6F3FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PULSO">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only}
html{background:#F6F3FF}
body{background:#F6F3FF!important;color:#171340!important;forced-color-adjust:none}
@media (prefers-color-scheme:dark){:root{color-scheme:light only}html,body{background:#F6F3FF!important;color:#171340!important}}

:root{
  --fondo:#F6F3FF; --blanco:#FFFFFF; --tinta:#171340; --tenue:#7B77A6; --linea:#E8E3FA;
  --pecho:#FF4D6D; --espalda:#7B5CFF; --hombros:#00C2A8; --biceps:#FF8A3D;
  --triceps:#FFB020; --piernas:#2E7DFF; --core:#FF5FA2; --cardio:#00CC6A;
  --c:var(--espalda); --c2:var(--piernas);
  --sombra:0 8px 26px rgba(23,19,64,.09);
  --sombra-c:0 10px 26px -6px color-mix(in srgb, var(--c) 55%, transparent);
  --r:22px;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --disp:'Bricolage Grotesque',sans-serif; --txt:'Outfit',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);color:var(--tinta);font-family:var(--txt);font-size:16px;line-height:1.45;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(46vw 46vw at 88% -6%, rgba(123,92,255,.30), transparent 68%),
    radial-gradient(40vw 40vw at -12% 12%, rgba(255,77,109,.22), transparent 68%),
    radial-gradient(50vw 50vw at 50% 108%, rgba(0,204,106,.18), transparent 70%);
}
button,input,select{font-family:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
.app{max-width:540px;margin:0 auto;min-height:100dvh}

/* ---------- cabecera ---------- */
.cab{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 18px) 20px 6px}
.marca{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.03em;line-height:1;display:flex;align-items:center;gap:7px}
.latido{width:11px;height:11px;border-radius:50%;background:var(--pecho);animation:latir 1.7s ease-in-out infinite}
@keyframes latir{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,77,109,.5)}50%{transform:scale(1.25);box-shadow:0 0 0 9px rgba(255,77,109,0)}}
.cab-fecha{font-size:12.5px;color:var(--tenue);margin-top:3px;text-transform:capitalize}
.icono-btn{width:42px;height:42px;display:grid;place-items:center;background:var(--blanco);border-radius:50%;box-shadow:var(--sombra);color:var(--tinta)}
.icono-btn:active{transform:scale(.93)}

main{padding:14px 20px 118px}
.vista{display:none}
.vista.on{display:block}
.vista.on>*{animation:sube .45s cubic-bezier(.2,.9,.3,1) both}
.vista.on>*:nth-child(1){animation-delay:.02s}
.vista.on>*:nth-child(2){animation-delay:.06s}
.vista.on>*:nth-child(3){animation-delay:.1s}
.vista.on>*:nth-child(4){animation-delay:.14s}
.vista.on>*:nth-child(5){animation-delay:.18s}
.vista.on>*:nth-child(6){animation-delay:.22s}
@keyframes sube{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.etq{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.titulo{font-family:var(--disp);font-weight:800;font-size:33px;line-height:1.06;letter-spacing:-.035em;margin:4px 0 18px}

/* ---------- héroe ---------- */
.heroe{
  border-radius:26px;padding:22px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#7B5CFF,#FF4D6D 58%,#FF8A3D);
  box-shadow:0 14px 34px -10px rgba(123,92,255,.6);
}
.heroe::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.14);top:-70px;right:-50px}
.heroe .etq{color:rgba(255,255,255,.85)}
.heroe h2{font-family:var(--disp);font-weight:800;font-size:29px;line-height:1.05;letter-spacing:-.03em;margin:6px 0 16px;position:relative}
.mini-stats{display:flex;gap:20px;position:relative}
.mini-stats div b{display:block;font-family:var(--disp);font-weight:800;font-size:27px;line-height:1;font-variant-numeric:tabular-nums}
.mini-stats div small{font-size:11.5px;opacity:.85;letter-spacing:.04em}

/* ---------- estadísticas de colores ---------- */
.placas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.placa{border-radius:18px;padding:14px 12px;color:#fff;box-shadow:0 8px 20px -8px rgba(23,19,64,.5)}
.placa:nth-child(1){background:linear-gradient(140deg,#7B5CFF,#2E7DFF)}
.placa:nth-child(2){background:linear-gradient(140deg,#FF4D6D,#FF8A3D)}
.placa:nth-child(3){background:linear-gradient(140deg,#00CC6A,#00C2A8)}
.placa b{display:block;font-family:var(--disp);font-weight:800;font-size:29px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.placa small{font-size:11px;opacity:.9;letter-spacing:.03em}

/* ---------- tarjetas ---------- */
.tarjeta{background:var(--blanco);border-radius:var(--r);padding:16px;margin-bottom:12px;display:block;width:100%;text-align:left;box-shadow:var(--sombra);transition:transform .18s}
.tarjeta:active{transform:scale(.98)}
.tarjeta h3{margin:0;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.02em}
.tarjeta p{margin:3px 0 0;font-size:13.5px;color:var(--tenue)}
.fila-tarjeta{display:flex;align-items:center;gap:12px}
.crece{flex:1;min-width:0}

.rut-tarjeta{border-radius:var(--r);padding:18px;margin-bottom:12px;color:#fff;box-shadow:var(--sombra-c);background:linear-gradient(135deg,var(--c),var(--c2));position:relative;overflow:hidden}
.rut-tarjeta::after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.13);bottom:-70px;right:-40px}
.rut-tarjeta h3{margin:0;font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.025em;position:relative}
.rut-tarjeta p{margin:4px 0 0;font-size:13px;opacity:.9;position:relative}
.jugar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;font-size:17px;flex:0 0 auto;position:relative;backdrop-filter:blur(4px)}
.jugar:active{transform:scale(.9)}

.btn{
  display:block;width:100%;text-align:center;padding:17px;border-radius:100px;
  background:linear-gradient(135deg,#7B5CFF,#FF4D6D);color:#fff;
  font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.01em;
  box-shadow:0 10px 24px -8px rgba(123,92,255,.75);transition:transform .18s;
}
.btn:active{transform:scale(.97)}
.btn.fantasma{background:var(--blanco);color:var(--tinta);box-shadow:var(--sombra)}
.btn.peligro{background:var(--blanco);color:var(--pecho);box-shadow:var(--sombra)}
.btn+.btn{margin-top:10px}

/* ---------- filtros ---------- */
.buscar{width:100%;background:var(--blanco);border:none;padding:15px 18px;font-size:16px;margin-bottom:12px;border-radius:100px;box-shadow:var(--sombra)}
.buscar::placeholder{color:var(--tenue)}
.buscar:focus{outline:2px solid var(--espalda)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 12px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 16px;border-radius:100px;background:var(--blanco);font-size:13.5px;font-weight:500;color:var(--tenue);white-space:nowrap;box-shadow:0 3px 10px rgba(23,19,64,.06);transition:.2s}
.chip.on{background:var(--c,#171340);color:#fff;font-weight:600;box-shadow:0 6px 16px -4px var(--c,#171340)}

/* ---------- lista de ejercicios ---------- */
.ej{display:flex;align-items:center;gap:13px;padding:13px 15px;width:100%;text-align:left;background:var(--blanco);border-radius:16px;margin-bottom:8px;box-shadow:0 3px 12px rgba(23,19,64,.05);transition:transform .16s}
.ej:active{transform:scale(.98)}
.punto{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);font-family:var(--disp);font-weight:800;font-size:15px}
.ej .nom{flex:1;min-width:0;font-size:15.5px;font-weight:500;line-height:1.25}
.ej .grp{font-size:12px;color:var(--tenue);font-weight:400}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:100px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.vacio{text-align:center;color:var(--tenue);padding:38px 20px;font-size:15px;line-height:1.6}

/* ---------- navegación ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:540px;margin:0 auto;
  padding:8px 12px calc(var(--sb) + 8px);display:flex;
  background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border-top:1px solid var(--linea);
}
nav button{flex:1;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--tenue);border-radius:16px;transition:.2s}
nav button.on{color:var(--espalda)}
nav button.on .ico{background:color-mix(in srgb,var(--espalda) 14%,#fff);transform:translateY(-2px)}
.ico{width:46px;height:30px;border-radius:100px;display:grid;place-items:center;transition:.24s cubic-bezier(.3,1.4,.5,1)}
nav span{font-size:10.5px;font-weight:600;letter-spacing:.02em}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- capas ---------- */
.capa{position:fixed;inset:0;z-index:50;background:var(--fondo);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .34s cubic-bezier(.3,.9,.25,1);max-width:540px;margin:0 auto}
.capa.on{transform:none}
.capa-cab{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 16px) 20px 12px}
.capa-cab h2{flex:1;margin:0;font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.capa-cuerpo{flex:1;overflow-y:auto;padding:6px 20px 30px;-webkit-overflow-scrolling:touch}
.capa-pie{padding:12px 20px calc(var(--sb) + 14px);background:linear-gradient(to top,var(--fondo) 70%,transparent)}
.cerrar{width:40px;height:40px;border-radius:50%;background:var(--blanco);box-shadow:var(--sombra);font-size:19px;color:var(--tenue);flex:0 0 auto}

/* ---------- entrenamiento ---------- */
.crono{font-family:var(--disp);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;background:var(--blanco);padding:9px 15px;border-radius:100px;box-shadow:var(--sombra);color:var(--espalda)}
.bloque{background:var(--blanco);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--sombra)}
.bloque-cab{display:flex;align-items:center;gap:11px;padding:15px 16px 12px;border-left:5px solid var(--c)}
.bloque-cab .n{flex:1;min-width:0;font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:-.02em}
.tag-desc{font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);padding:5px 10px;border-radius:100px}
.ultima{font-size:12.5px;color:var(--tenue);padding:0 16px 10px 21px}
.enc-series,.serie{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:9px;align-items:center;padding:5px 16px}
.enc-series{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);text-align:center}
.serie{padding-bottom:7px}
.serie .idx{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--tenue);text-align:center}
.serie input{width:100%;background:var(--fondo);border:2px solid transparent;padding:12px 4px;text-align:center;font-family:var(--disp);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;border-radius:14px}
.serie input:focus{outline:none;border-color:var(--c)}
.check{width:42px;height:42px;border-radius:14px;background:var(--fondo);display:grid;place-items:center;color:var(--tenue);font-size:17px;justify-self:end;transition:.2s}
.serie.hecha .check{background:var(--c);color:#fff;animation:pop .34s cubic-bezier(.3,1.6,.5,1)}
.serie.hecha input{background:color-mix(in srgb,var(--c) 9%,#fff);color:var(--c)}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.mini{font-size:13px;font-weight:600;color:var(--c);padding:12px 16px 15px;display:block;width:100%;text-align:left}
.quitar{width:30px;color:var(--tenue);font-size:17px;flex:0 0 auto}

/* ---------- descanso (elemento firma) ---------- */
#descanso{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;max-width:540px;margin:0 auto;color:#fff;background:linear-gradient(160deg,var(--c),var(--c2))}
#descanso.on{display:flex;animation:aparece .3s ease both}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.aro{position:relative;width:min(72vw,290px);aspect-ratio:1}
.aro svg{width:100%;height:100%;transform:rotate(-90deg)}
.aro .fondo-aro{fill:none;stroke:rgba(255,255,255,.24);stroke-width:9}
.aro .barra-aro{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.aro .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.aro .num{font-family:var(--disp);font-weight:800;font-size:min(21vw,84px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.aro .sub{font-size:13px;opacity:.9;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.desc-btns{display:flex;gap:12px;width:min(76vw,320px);margin-top:36px}
.desc-btns button{flex:1;padding:16px;border-radius:100px;font-family:var(--disp);font-weight:700;font-size:16px}
#descMas{background:rgba(255,255,255,.22);color:#fff}
#descSaltar{background:#fff;color:var(--c)}

/* ---------- editor rutina ---------- */
.campo{margin-bottom:16px}
.campo label{display:block;margin-bottom:8px}
.campo input,.campo select{width:100%;background:var(--blanco);border:none;padding:15px 16px;font-size:16px;border-radius:16px;box-shadow:var(--sombra)}
.campo input:focus,.campo select:focus{outline:2px solid var(--espalda)}
.item-rut{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:16px;margin-bottom:9px;background:var(--blanco);box-shadow:0 3px 12px rgba(23,19,64,.05);border-left:5px solid var(--c)}
.item-rut b{display:block;font-size:15.5px;font-weight:600;line-height:1.25}
.item-rut small{color:var(--tenue);font-size:12.5px}
.paso{display:flex;align-items:center;background:var(--fondo);border-radius:100px;flex:0 0 auto}
.paso button{width:32px;height:32px;border-radius:50%;color:var(--c);font-size:18px;font-weight:600}
.paso b{font-family:var(--disp);font-weight:800;font-size:15px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- progreso ---------- */
.grafica{background:var(--blanco);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--sombra)}
.grafica svg{width:100%;height:158px;display:block;overflow:visible}
.leyenda{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tenue);margin-top:10px;font-weight:500}
.hist-fila{display:flex;gap:12px;align-items:center;padding:14px 16px;width:100%;text-align:left;background:var(--blanco);border-radius:16px;margin-bottom:8px;box-shadow:0 3px 12px rgba(23,19,64,.05)}
.hist-fila b{font-size:15.5px;font-weight:600}
.hist-fila small{display:block;color:var(--tenue);font-size:12.5px}
.hist-det{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--espalda);font-variant-numeric:tabular-nums}
.barritas{display:flex;gap:5px;align-items:flex-end;height:52px;margin:14px 0 4px}
.barrita{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(to top,#7B5CFF,#FF5FA2);min-height:5px;opacity:.28;animation:crece .6s cubic-bezier(.2,1,.3,1) both}
.barrita.act{opacity:1}
@keyframes crece{from{transform:scaleY(.05);transform-origin:bottom}to{transform:scaleY(1)}}
.dias{display:flex;gap:5px;font-size:10.5px;color:var(--tenue);text-align:center;font-weight:500}
.dias span{flex:1}

.aviso{position:fixed;left:50%;transform:translateX(-50%) translateY(18px);bottom:calc(var(--sb) + 88px);background:var(--tinta);color:#fff;padding:13px 20px;border-radius:100px;font-size:14px;font-weight:500;z-index:90;opacity:0;transition:.26s;pointer-events:none;max-width:88%;text-align:center;box-shadow:0 10px 30px rgba(23,19,64,.3)}
.aviso.on{opacity:1;transform:translateX(-50%)}
hr.sep{border:none;height:1px;background:var(--linea);margin:22px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--espalda);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header class="cab">
    <div>
      <div class="marca"><span class="latido"></span>PULSO</div>
      <div class="cab-fecha" id="fechaHoy"></div>
    </div>
    <button class="icono-btn" id="btnAjustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="vista on" id="v-hoy">
      <div id="hoyActiva"></div>
      <div class="heroe">
        <div class="etq">Esta semana</div>
        <h2 id="saludo">Vamos a movernos</h2>
        <div class="mini-stats">
          <div><b id="sSes">0</b><small>Sesiones</small></div>
          <div><b id="sVol">0</b><small id="sVolU">Volumen kg</small></div>
          <div><b id="sMin">0</b><small>Minutos</small></div>
        </div>
      </div>
      <div class="tarjeta" id="semanaCard"></div>
      <button class="btn" id="btnEmpezar">Empezar entrenamiento</button>
      <button class="btn fantasma" id="btnLibre">Entrenamiento libre</button>
      <div>
        <hr class="sep">
        <div class="etq" style="margin-bottom:12px">Últimas sesiones</div>
        <div id="hoyHist"></div>
      </div>
    </section>

    <section class="vista" id="v-rutinas">
      <div class="etq">Tus planes</div>
      <h1 class="titulo">Rutinas</h1>
      <div id="listaRutinas"></div>
      <button class="btn fantasma" id="btnNuevaRutina">+ Nueva rutina</button>
    </section>

    <section class="vista" id="v-ejercicios">
      <div class="etq">Biblioteca</div>
      <h1 class="titulo">Ejercicios</h1>
      <input class="buscar" id="buscarEj" placeholder="Buscar ejercicio" autocomplete="off">

const EJI={}; EJ.forEach(x=>EJI[x.id]=x);

const RUTINAS_BASE=[
 {id:'r-empuje',nombre:'Empuje — pecho, hombro, tríceps',items:[
   {ej:'p1',series:4,descanso:120},{ej:'p3',series:3,descanso:90},{ej:'h2',series:3,descanso:90},
   {ej:'h3',series:3,descanso:60},{ej:'t1',series:3,descanso:60},{ej:'t2',series:3,descanso:60}]},
 {id:'r-jale',nombre:'Jale — espalda y bíceps',items:[
   {ej:'e4',series:4,descanso:90},{ej:'e2',series:4,descanso:120},{ej:'e3',series:3,descanso:90},
   {ej:'h5',series:3,descanso:60},{ej:'b1',series:3,descanso:60},{ej:'b3',series:3,descanso:60}]},
 {id:'r-pierna',nombre:'Pierna completa',items:[
   {ej:'g1',series:4,descanso:150},{ej:'g4',series:3,descanso:120},{ej:'g3',series:3,descanso:90},
   {ej:'g7',series:3,descanso:90},{ej:'g10',series:4,descanso:45},{ej:'c5',series:3,descanso:45}]},
 {id:'r-casa',nombre:'Cuerpo completo en casa',items:[
   {ej:'g11',series:3,descanso:60},{ej:'p6',series:3,descanso:60},{ej:'g14',series:3,descanso:60},
   {ej:'e7',series:3,descanso:60},{ej:'c1',series:3,descanso:45},{ej:'k6',series:3,descanso:45}]}
];

/* ====================== ESTADO ====================== */
const K={r:'pulso.rutinas',h:'pulso.historial',a:'pulso.ajustes',s:'pulso.sesion'};
const leer=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const grabar=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){avisar('No se pudo guardar')}};
let rutinas=leer(K.r,null);
if(!rutinas){rutinas=JSON.parse(JSON.stringify(RUTINAS_BASE));grabar(K.r,rutinas)}
let historial=leer(K.h,[]);
let ajustes=Object.assign({unidad:'kg',descanso:90,sonido:true},leer(K.a,{}));
let sesion=leer(K.s,null);
const U=()=>ajustes.unidad;

/* ====================== UTILIDADES ====================== */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function avisar(t){const a=$('#aviso');a.textContent=t;a.classList.add('on');clearTimeout(a._t);a._t=setTimeout(()=>a.classList.remove('on'),2200)}
function fechaCorta(ts){return new Date(ts).toLocaleDateString('es-DO',{day:'numeric',month:'short'})}
function volSesion(s){let v=0;s.ej.forEach(b=>b.sets.forEach(x=>{if(x.hecho&&EJI[b.ej]&&EJI[b.ej].m==='peso')v+=(+x.peso||0)*(+x.reps||0)}));return Math.round(v)}
function minSesion(s){return Math.max(1,Math.round(((s.fin||Date.now())-s.inicio)/60000))}
function abrir(id){$(id).classList.add('on')}
function cerrar(id){$(id).classList.remove('on')}
function pintaColor(nodo,g){nodo.style.setProperty('--c',cg(g));nodo.style.setProperty('--c2',cg2(g))}
function grupoRutina(r){const c={};r.items.forEach(i=>{const g=EJI[i.ej]&&EJI[i.ej].g;if(g)c[g]=(c[g]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'Espalda'}
function contar(nodo,fin){
  const dur=650,ini=performance.now();
  const paso=t=>{const p=Math.min(1,(t-ini)/dur);const v=Math.round(fin*(1-Math.pow(1-p,3)));
    nodo.textContent=v.toLocaleString('es-DO');if(p<1)requestAnimationFrame(paso)};
  requestAnimationFrame(paso);
}

/* ====================== NAVEGACIÓN ====================== */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.vista').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); $('#v-'+b.dataset.v).classList.add('on');
  window.scrollTo(0,0);
  if(b.dataset.v==='hoy')pintarHoy();
  if(b.dataset.v==='rutinas')pintarRutinas();
  if(b.dataset.v==='progreso')pintarProgreso();
});
$('#fechaHoy').textContent=new Date().toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'});

/* ====================== HOY ====================== */
function pintarHoy(){
  const act=$('#hoyActiva');act.innerHTML='';
  if(sesion){
    const c=el('div','rut-tarjeta');
    pintaColor(c,'Cardio');
    const f=el('div','fila-tarjeta');
    f.innerHTML='<div class="crece"><div class="etq" style="color:rgba(255,255,255,.85)">En curso</div><h3>'+esc(sesion.nombre)+'</h3><p>Toca para continuar</p></div>';
    const j=el('button','jugar','▶');
    f.appendChild(j);c.appendChild(f);
    c.onclick=()=>abrirEntrenamiento();
    act.appendChild(c);
  }
  const hace7=Date.now()-7*864e5;
  const sem=historial.filter(s=>s.fin>=hace7);
  contar($('#sSes'),sem.length);
  contar($('#sVol'),sem.reduce((a,s)=>a+s.volumen,0));
  $('#sVolU').textContent='Volumen '+U();
  contar($('#sMin'),sem.reduce((a,s)=>a+s.minutos,0));
  $('#saludo').textContent=sem.length?(sem.length===1?'1 sesión hecha':sem.length+' sesiones hechas'):'Vamos a movernos';

  // barritas de los últimos 7 días
  const dias=['D','L','M','M','J','V','S'];
  const hoy=new Date();hoy.setHours(23,59,59,999);
  let barras='',etiq='';
  const vals=[];
  for(let i=6;i>=0;i--){
    const d=new Date(hoy);d.setDate(d.getDate()-i);
    const ini=new Date(d);ini.setHours(0,0,0,0);
    const v=historial.filter(s=>s.fin>=ini.getTime()&&s.fin<=d.getTime()).reduce((a,s)=>a+s.minutos,0);
    vals.push({v,d});
  }
  const mx=Math.max(...vals.map(x=>x.v),30);
  vals.forEach((x,i)=>{
    barras+='<div class="barrita'+(x.v?' act':'')+'" style="height:'+Math.max(6,(x.v/mx)*52)+'px;animation-delay:'+(i*.05)+'s"></div>';
    etiq+='<span>'+dias[x.d.getDay()]+'</span>';
  });
  $('#semanaCard').innerHTML='<div class="etq">Minutos por día</div><div class="barritas">'+barras+'</div><div class="dias">'+etiq+'</div>';

  const cont=$('#hoyHist');cont.innerHTML='';
  const u=historial.slice(0,3);
  if(!u.length){cont.appendChild(el('div','vacio','Todavía no hay sesiones.<br>La primera empieza aquí arriba. 💪'));return}
  u.forEach(s=>cont.appendChild(filaHist(s)));
}
function filaHist(s){
  const f=el('button','hist-fila');
  f.innerHTML='<div class="crece"><b>'+esc(s.nombre)+'</b><small>'+fechaCorta(s.fin)+' · '+s.minutos+' min · '+s.ej.length+' ejercicios</small></div><div class="hist-det">'+s.volumen.toLocaleString('es-DO')+'</div>';
  f.onclick=()=>verSesion(s);
  return f;
}
$('#btnLibre').onclick=()=>{if(sesion){abrirEntrenamiento();return}iniciarSesion(null)};
$('#btnEmpezar').onclick=()=>{
  if(sesion){abrirEntrenamiento();return}
  $('#infoTitulo').textContent='¿Cuál rutina?';
  const c=$('#infoCuerpo');c.innerHTML='';
  rutinas.forEach(r=>{
    const t=el('div','rut-tarjeta');pintaColor(t,grupoRutina(r));
    t.innerHTML='<h3>'+esc(r.nombre)+'</h3><p>'+r.items.length+' ejercicios · '+r.items.reduce((a,i)=>a+i.series,0)+' series</p>';
    t.onclick=()=>{cerrar('#capaInfo');iniciarSesion(r)};
    c.appendChild(t);
  });
  const l=el('button','btn fantasma','Entrenamiento libre');
  l.onclick=()=>{cerrar('#capaInfo');iniciarSesion(null)};
  c.appendChild(l);
  abrir('#capaInfo');
};

/* ====================== ENTRENAMIENTO ====================== */
let cronoInt=null,bloqueo=null;
function iniciarSesion(rut){
  sesion={id:uid(),rutinaId:rut?rut.id:null,nombre:rut?rut.nombre:'Entrenamiento libre',
    inicio:Date.now(),fin:null,
    ej:(rut?rut.items:[]).map(it=>({ej:it.ej,descanso:it.descanso||ajustes.descanso,
      sets:Array.from({length:it.series},()=>({peso:'',reps:'',min:'',hecho:false}))}))};
  grabar(K.s,sesion);abrirEntrenamiento();
}
async function abrirEntrenamiento(){
  pintarEntrenamiento();abrir('#capaEnt');
  clearInterval(cronoInt);
  const tick=()=>{$('#entCrono').textContent=mmss((Date.now()-sesion.inicio)/1000)};
  tick();cronoInt=setInterval(tick,1000);
  try{if('wakeLock' in navigator)bloqueo=await navigator.wakeLock.request('screen')}catch(e){}
}
$('#minEnt').onclick=()=>{cerrar('#capaEnt');clearInterval(cronoInt);if(bloqueo){bloqueo.release();bloqueo=null}pintarHoy()};
function pintarEntrenamiento(){
  $('#entNombre').textContent=sesion.nombre;
  const c=$('#entCuerpo');c.innerHTML='';
  if(!sesion.ej.length)c.appendChild(el('div','vacio','Agrega el primer ejercicio para arrancar.'));
  sesion.ej.forEach((b,bi)=>{
    const ej=EJI[b.ej];if(!ej)return;
    const box=el('div','bloque');pintaColor(box,ej.g);
    const cab=el('div','bloque-cab');
    cab.innerHTML='<div class="n">'+esc(ej.n)+'</div><div class="tag-desc">'+b.descanso+'s</div>';
    const x=el('button','quitar','✕');x.setAttribute('aria-label','Quitar ejercicio');
    x.onclick=()=>{if(confirm('¿Quitar '+ej.n+' de esta sesión?')){sesion.ej.splice(bi,1);guardarSesion();pintarEntrenamiento()}};
    cab.appendChild(x);box.appendChild(cab);
    const ult=ultimaVez(b.ej);
    if(ult)box.appendChild(el('div','ultima','Última vez: '+ult));
    const enc=el('div','enc-series');
    enc.innerHTML='<div></div><div>'+(ej.m==='peso'?U():'Minutos')+'</div><div>'+(ej.m==='peso'?'Reps':'Nivel')+'</div><div></div>';
    box.appendChild(enc);
    b.sets.forEach((s,si)=>box.appendChild(filaSerie(b,s,si,ej)));
    const add=el('button','mini','+ Agregar serie');
    add.onclick=()=>{const l=b.sets[b.sets.length-1]||{};b.sets.push({peso:l.peso||'',reps:l.reps||'',min:l.min||'',hecho:false});guardarSesion();pintarEntrenamiento()};
    box.appendChild(add);c.appendChild(box);
  });

let descInt=null,descFin=0,descTot=0;
const RAD=88,CIRC=2*Math.PI*RAD;
$('#aroBarra').style.strokeDasharray=CIRC;
function iniciarDescanso(seg,grupo){
  descTot=seg;descFin=Date.now()+seg*1000;
  const d=$('#descanso');pintaColor(d,grupo||'Espalda');
  d.classList.add('on');pintarDescanso();
  clearInterval(descInt);descInt=setInterval(pintarDescanso,150);
}
function pintarDescanso(){
  const r=(descFin-Date.now())/1000;
  const p=Math.max(0,Math.min(1,r/descTot));
  $('#descNum').textContent=r>=60?mmss(r):Math.max(0,Math.ceil(r));
  $('#aroBarra').style.strokeDashoffset=CIRC*(1-p);
  if(r<=0)finDescanso(true);
}
function finDescanso(sonar){
  clearInterval(descInt);$('#descanso').classList.remove('on');
  if(sonar&&ajustes.sonido){
    try{navigator.vibrate&&navigator.vibrate([120,80,120])}catch(e){}
    try{
      const A=new(window.AudioContext||window.webkitAudioContext)();
      [660,880].forEach((f,i)=>{
        const o=A.createOscillator(),g=A.createGain();
        o.frequency.value=f;o.connect(g);g.connect(A.destination);
        const t=A.currentTime+i*.16;
        g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+.32);
        o.start(t);o.stop(t+.34);
      });
    }catch(e){}
  }
}

$('#descMas').onclick=()=>{descFin+=15000;descTot+=15;pintarDescanso()};

function pintarProgreso(){

  const usados=EJ.filter(x=>historial.some(s=>s.ej.some(y=>y.ej===x.id)));

    pintarGrafica(sel.value);
  }
  const c=$('#histCompleto');c.innerHTML='';
  if(!historial.length)c.appendChild(el('div','vacio','Sin sesiones todavía.'));
  historial.forEach(s=>c.appendChild(filaHist(s)));
}
$('#selProg').onchange=e=>pintarGrafica(e.target.value);
function racha(){
  if(!historial.length)return 0;
  const sem=t=>Math.floor((t-new Date(2024,0,1).getTime())/(7*864e5));
  const set=new Set(historial.map(s=>sem(s.fin)));
  let n=0,w=sem(Date.now());
  if(!set.has(w))w--;
  while(set.has(w)){n++;w--}
  return n;
}
function pintarGrafica(id){
  const ej=EJI[id],caja=$('#cajaGrafica'),color=cg(ej.g);
  const pts=[];
  historial.slice().reverse().forEach(s=>{
    const b=s.ej.find(y=>y.ej===id);if(!b)return;
    const v=b.sets.reduce((a,x)=>Math.max(a,ej.m==='peso'?+x.peso||0:+x.min||0),0);
    if(v>0)pts.push({v,t:s.fin});
  });
  if(!pts.length){caja.innerHTML='<div class="vacio">Sin registros con valor todavía.</div>';return}
  const W=300,H=158,P=8;
  const max=Math.max(...pts.map(p=>p.v)),min=Math.min(...pts.map(p=>p.v));
  const rango=(max-min)||max||1;
  const X=i=>pts.length===1?W/2:P+i*(W-2*P)/(pts.length-1);
  const Y=v=>H-P-((v-min)/rango)*(H-2*P);
  const linea=pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ');
  const area='M'+X(0)+','+H+' L'+pts.map((p,i)=>X(i)+','+Y(p.v)).join(' L')+' L'+X(pts.length-1)+','+H+' Z';
  const puntos=pts.map((p,i)=>'<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4" fill="#fff" stroke="'+color+'" stroke-width="3"/>').join('');
  caja.innerHTML='<div class="grafica">'+
    '<div class="etq" style="color:'+color+'">'+esc(ej.n)+' — mejor serie</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Progreso de '+esc(ej.n)+'">'+
    '<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".35"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#gr)"/>'+
    '<polyline points="'+linea+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+
    puntos+'</svg>'+
    '<div class="leyenda"><span>'+fechaCorta(pts[0].t)+'</span><span style="color:'+color+';font-weight:700">'+max+' '+(ej.m==='peso'?U():'min')+' máx</span><span>'+fechaCorta(pts[pts.length-1].t)+'</span></div>'+
    '</div>';
}

p5:['Pecho, tríceps, hombro',['Súbete a las barras con los brazos estirados y el cuerpo ligeramente inclinado al frente.','Baja hasta que los hombros queden a la altura de los codos.','Empuja hacia arriba apretando el pecho.'],'Si sientes pinchazo en el hombro, no bajes tanto. Rango cómodo antes que rango máximo.'],

p7:['Tríceps, pecho interno',['Junta las manos formando un triángulo con los pulgares e índices, bajo el pecho.','Baja pegando los codos al cuerpo.','Empuja hasta estirar.'],'Si te duelen las muñecas, separa un poco las manos o hazlas sobre mancuernas.'],

e3:['Dorsal, espalda media',['Apoya una rodilla y una mano en el banco, la otra pierna firme en el piso.','Tira la mancuerna hacia la cadera, codo pegado al costado.','Baja estirando bien el brazo.'],'No gires el torso para levantar más peso: eso ya no es espalda, es impulso.'],
e4:['Dorsal, bíceps',['Siéntate con los muslos trancados bajo el soporte y agarra la barra ancha.','Tira hacia la parte alta del pecho llevando los codos abajo y atrás.','Sube controlado hasta estirar los brazos.'],'No lo tires detrás de la nuca ni te eches para atrás con todo el cuerpo.'],
e5:['Espalda media, dorsal, bíceps',['Siéntate con las rodillas ligeramente dobladas y la espalda recta.','Tira el agarre hacia el abdomen juntando los omóplatos.','Regresa dejando que los brazos se estiren sin encorvarte.'],'No te balancees adelante y atrás usando la espalda baja como bisagra.'],
e6:['Toda la cadena posterior',['Barra pegada a las espinillas, pies al ancho de la cadera, agarre por fuera de las piernas.','Saca pecho, aprieta la espalda y empuja el piso con los pies mientras subes la barra pegada al cuerpo.','Arriba, párate derecho sin echarte hacia atrás.'],'Este es el ejercicio donde más gente se lesiona por apurarse. Domina la técnica con poco peso primero.'],
e7:['Espalda, bíceps, core',['Acuéstate bajo una barra baja o una mesa firme, agarra con las manos al ancho de los hombros.','Mantén el cuerpo recto y tira del pecho hacia la barra.','Baja controlado hasta estirar.'],'Mientras más horizontal esté tu cuerpo, más difícil. Dobla las rodillas para hacerlo más fácil.'],
e8:['Lumbar, glúteo',['Acuéstate boca abajo con brazos estirados al frente.','Levanta al mismo tiempo brazos, pecho y piernas unos centímetros.','Aguanta un segundo arriba y baja lento.'],'No fuerces el cuello mirando hacia arriba: la vista va al piso.'],
h1:['Hombro, tríceps, core',['De pie, barra a la altura de las clavículas, pies al ancho de la cadera.','Aprieta glúteos y abdomen, empuja la barra derecho hacia arriba pasando la cara.','Arriba, mete la cabeza un poco al frente para terminar el recorrido.'],'No arquees la espalda baja para compensar. Si lo haces, hay demasiado peso.'],
h2:['Hombro, tríceps',['Sentado o de pie, mancuernas a la altura de las orejas, palmas al frente.','Empuja hacia arriba hasta casi juntarlas.','Baja controlado hasta la altura de las orejas.'],'No bajes por debajo de los hombros buscando estiramiento extra.'],
h3:['Deltoide lateral',['Mancuernas a los lados, codos apenas doblados y fijos.','Sube los brazos a los lados hasta la altura de los hombros, no más.','Baja lento resistiendo la caída.'],'Sube con el codo, no con la mano. Si tienes que impulsarte, el peso está muy alto.'],
h4:['Deltoide anterior',['Mancuernas al frente de los muslos, palmas hacia abajo.','Sube los brazos al frente hasta la altura de los hombros.','Baja controlado.'],'No uses la espalda baja como resorte para lanzar el peso.'],
h5:['Deltoide posterior, espalda alta',['Inclina el torso al frente casi paralelo al piso, brazos colgando.','Abre los brazos hacia los lados juntando los omóplatos.','Baja controlado.'],'Peso liviano. Este músculo es chiquito y responde a la técnica, no a la carga.'],
h6:['Trapecio',['De pie con mancuernas a los lados, brazos estirados.','Sube los hombros hacia las orejas lo más alto que puedas.','Baja lento y completo.'],'No des vueltas con los hombros. El movimiento es solo arriba y abajo.'],
h7:['Hombro, tríceps',['Ponte en posición de flexión y camina los pies hacia las manos formando una V invertida.','Baja la cabeza hacia el piso entre las manos, doblando los codos.','Empuja hacia arriba.'],'Mientras más vertical la cadera, más trabaja el hombro.'],

b2:['Bíceps',['Mancuernas a los lados, palmas al frente.','Sube doblando el codo, girando ligeramente la muñeca hacia afuera arriba.','Baja controlado hasta estirar.'],'Bajar lento vale tanto como subir. No dejes caer el peso.'],

b4:['Bíceps (pico)',['Apoya la parte de atrás de los brazos en el banco inclinado.','Sube la barra hasta media altura y baja hasta casi estirar.','Nunca sueltes la tensión abajo.'],'No estires el codo de golpe al final: con el brazo trancado en el banco es fácil forzar el tendón.'],

/* ---------- motor de dibujo ---------- */
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function mezcla(A,B,t){
  const o={};
  Object.keys(A).forEach(k=>{
    if(k==='d'){o.d=A.d;return}
    o[k]=B[k]?lerp(A[k],B[k],t):A[k];
  });
  return o;
}
function equipo(q,p,c){
  const m=p.man||[100,100],g='#171340';
  const L=(x1,y1,x2,y2,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${g}" stroke-width="${w||5}" stroke-linecap="round" opacity=".8"/>`;
  const R=(x,y,w,h,r)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r||3}" fill="${g}" opacity=".8"/>`;
  switch(q){
    case 'barra': return L(m[0]-36,m[1],m[0]+36,m[1],5)+R(m[0]-42,m[1]-13,8,26,3)+R(m[0]+34,m[1]-13,8,26,3);
    case 'mancuerna': return L(m[0]-12,m[1],m[0]+12,m[1],5)+R(m[0]-18,m[1]-10,7,20,3)+R(m[0]+11,m[1]-10,7,20,3);
    case 'polea': return R(168,24,10,156,4)+L(173,28,m[0],m[1],2.5)+R(m[0]-9,m[1]-3,18,6,3);
    case 'maquina': return R(150,96,34,86,6);
    case 'banco': return R(52,132,86,9,4)+R(58,141,7,38,3)+R(126,141,7,38,3);
    case 'barraFija': return L(34,30,166,30,5);
    case 'barraBaja': return L(34,120,166,120,5)+L(40,120,40,182,4)+L(160,120,160,182,4);
    case 'paralelas': return L(56,86,144,86,5)+L(60,86,60,182,4)+L(140,86,140,182,4);
    case 'cajon': return R(36,150,40,32,5);
    case 'rueda': return `<circle cx="${m[0]}" cy="${m[1]+8}" r="13" fill="none" stroke="${g}" stroke-width="5" opacity=".8"/>`;
    case 'cuerda': return `<path d="M ${m[0]} ${m[1]} Q 100 ${p.cab[1]-46} ${200-m[0]} ${m[1]}" fill="none" stroke="${g}" stroke-width="2.5" opacity=".55"/>`;
    case 'cinta': return R(40,168,120,14,5);
    default: return '';
  }
}
function aclarar(hex,t){
  const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const m=v=>Math.round(v+(255-v)*t);
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);
}
function _cap(a,b,r1,r2,f){
  const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  const P=[[a[0]+nx*r1,a[1]+ny*r1],[b[0]+nx*r2,b[1]+ny*r2],[b[0]-nx*r2,b[1]-ny*r2],[a[0]-nx*r1,a[1]-ny*r1]];
  return `<polygon points="${P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${f}"/>`+
         `<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${r1}" fill="${f}"/>`+
         `<circle cx="${b[0].toFixed(1)}" cy="${b[1].toFixed(1)}" r="${r2}" fill="${f}"/>`;
}
function cap(a,b,r1,r2,c,halo){
  return (halo?_cap(a,b,r1+halo,r2+halo,'#fff'):'')+_cap(a,b,r1,r2,c);
}
function torso(hom,cad,c){
  const dx=cad[0]-hom[0],dy=cad[1]-hom[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  const cin=[hom[0]+dx*.55,hom[1]+dy*.55];
  const A=[[hom,17],[cin,10.5],[cad,14.5]];
  const pts=A.map(([p,w])=>[p[0]+nx*w,p[1]+ny*w]).concat(A.slice().reverse().map(([p,w])=>[p[0]-nx*w,p[1]-ny*w]));
  return `<polygon points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${c}"/>`+
         `<circle cx="${cad[0].toFixed(1)}" cy="${cad[1].toFixed(1)}" r="14.5" fill="${c}"/>`;
}
const ESC={pressBanca:'banco',pressIncl:'banco',prensa:'maquina',bici:'maquina',remoMaq:'maquina',escaladora:'maquina'};
function dibujar(p,q,color,fam){
  const cf=aclarar(color,.55);
  const detras=['banco','barraFija','paralelas','barraBaja','cajon','maquina','cinta','polea'];
  const escena=(ESC[fam]&&ESC[fam]!==q)?equipo(ESC[fam],p,color):'';
  const fondo=escena+(detras.includes(q)?equipo(q,p,color):'');
  const frente=detras.includes(q)?'':equipo(q,p,color);
  const rod2=p.rod2||[p.rod[0]-9,p.rod[1]],pie2=p.pie2||[p.pie[0]-9,p.pie[1]];
  const cod2=p.cod2||(p.cod?[p.cod[0]-9,p.cod[1]]:null),man2=p.man2||(p.man?[p.man[0]-9,p.man[1]]:null);
  const cadF=[p.cad[0]-5,p.cad[1]],homF=[p.hom[0]-5,p.hom[1]];
  return `<svg viewBox="0 0 200 200" role="img">
  <line x1="8" y1="185" x2="192" y2="185" stroke="#E8E3FA" stroke-width="4" stroke-linecap="round"/>
  ${fondo}
  ${cap(cadF,rod2,11,7.5,cf,0)}${cap(rod2,pie2,7.5,4,cf,0)}
  ${cod2?cap(homF,cod2,7.5,5.5,cf,0)+cap(cod2,man2,5.5,3.5,cf,0):''}
  ${cap(p.hom,p.cab,6.5,6.5,color,0)}
  ${torso(p.hom,p.cad,color)}
  <circle cx="${p.cab[0]}" cy="${p.cab[1]}" r="13.6" fill="#fff"/>
  <circle cx="${p.cab[0]}" cy="${p.cab[1]}" r="11.5" fill="${color}"/>
  ${cap(p.cad,p.rod,12.5,8,color,2)}${cap(p.rod,p.pie,8.5,4.5,color,0)}
  ${p.cod?cap(p.hom,p.cod,8.5,6,color,2)+cap(p.cod,p.man,6,4,color,0):''}
  ${frente}
  </svg>`;
}
let animId=null;
function animar(cont,ejId,color){
  const cfg=MOV[ejId]||['sentadilla',''];
  const par=F[cfg[0]]||F.sentadilla;
  const caja=cont.querySelector('.lienzo'),fase=cont.querySelector('.fase');
  let ini=performance.now(),pausa=false,vel=1;
  cont.querySelector('.pz').onclick=e=>{pausa=!pausa;e.currentTarget.textContent=pausa?'▶':'❚❚';if(!pausa){ini=performance.now()-guardT;requestAnimationFrame(paso)}};
  cont.querySelector('.vl').onclick=e=>{vel=vel===1?.4:1;e.currentTarget.textContent=vel===1?'1×':'½×'};
  let guardT=0;
  function paso(t){
    if(pausa)return;
    guardT=t-ini;
    const ciclo=2400/vel;
    const f=(guardT%ciclo)/ciclo;
    const bruto=f<.5?f*2:(1-f)*2;
    const e=bruto<.5?4*bruto*bruto*bruto:1-Math.pow(-2*bruto+2,3)/2;
    caja.innerHTML=dibujar(mezcla(par[0],par[1],e),cfg[1],color,cfg[0]);
    fase.textContent=f<.5?'Bajando o tirando':'Empujando o subiendo';
    animId=requestAnimationFrame(paso);
  }
  cancelAnimationFrame(animId);
  animId=requestAnimationFrame(paso);
}

function calcularPlan(pf){
  const bmr=pf.sexo==='h'?10*pf.peso+6.25*pf.altura-5*pf.edad+5:10*pf.peso+6.25*pf.altura-5*pf.edad-161;
  const act={sed:1.2,lig:1.375,mod:1.55,alt:1.725}[pf.actividad];
  const tdee=bmr*act;
  let kcal = pf.meta==='bajar' ? tdee*0.85 : pf.meta==='ganar' ? tdee*1.10 : tdee;
  const piso=pf.sexo==='h'?1500:1200;
  let ajustado=false;
  if(kcal<piso){kcal=piso;ajustado=true}
  const prot=Math.round(pf.peso*(pf.meta==='bajar'?1.8:1.6));
  const gras=Math.round(pf.peso*0.8);
  const carb=Math.max(50,Math.round((kcal-prot*4-gras*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:Math.round(kcal),prot,gras,carb,piso,ajustado};
}
function totalDia(f){

}

  const ed=el('button','btn fantasma','Editar mi perfil');ed.onclick=abrirPerfil;v.appendChild(ed);

/* ---------- ficha del alimento ---------- */
function fichaAlimento(a,onAdd){
  const [nom,por,k,p,c,g,sat,az,so,fi,niv,nota,alt]=a;
  $('#infoTitulo').textContent=nom;
  const cc=$('#infoCuerpo');cc.innerHTML='';
  const col=NIVCOL[niv];
  cc.appendChild(el('div','nivchip','<span style="width:9px;height:9px;border-radius:50%;background:#fff"></span>'+NIVTXT[niv])).style.background=col;
  cc.appendChild(el('div','vacio','Porción de referencia: '+por+' · '+k+' kcal')).style.padding='0 0 10px';
  const bar=(et,v,lim,color,uni)=>'<div class="nfila"><div class="et">'+et+'</div><div class="bb"><i style="width:'+Math.min(100,v/lim*100)+'%;background:'+color+'"></i></div><div class="vv">'+v+uni+'</div></div>';
  const n=el('div','nutri');
  n.innerHTML=bar('Proteína',p,50,'#00CC6A',' g')+
    bar('Carbohidratos',c,120,'#FFB020',' g')+
    bar('Grasa total',g,40,'#7B5CFF',' g')+
    bar('Grasa saturada',sat,LIM.sat,sat>=5?'#FF4D6D':'#FFB020',' g')+
    bar('Azúcar',az,LIM.az,az>=20?'#FF4D6D':'#FFB020',' g')+
    bar('Sodio (sal)',so,LIM.so,so>=600?'#FF4D6D':'#FFB020',' mg')+
    bar('Fibra',fi,LIM.fi,'#00C2A8',' g');
  cc.appendChild(n);
  cc.appendChild(el('div','dr','<h4>🩺 Qué le hace a tu cuerpo</h4>'+nota));
  const detalles=[];
  if(sat>=5)detalles.push('Cubre el '+Math.round(sat/LIM.sat*100)+'% de la grasa saturada que deberías comer en todo el día.');
  if(az>=20)detalles.push('Trae el equivalente a '+Math.round(az/4)+' cucharaditas de azúcar.');
  if(so>=600)detalles.push('Aporta el '+Math.round(so/LIM.so*100)+'% del sodio de tu día. El sodio alto sube la presión arterial.');
  if(p>=20)detalles.push('Con '+p+' g de proteína ayuda directo a reparar el músculo después de entrenar.');
  if(fi>=5)detalles.push('Sus '+fi+' g de fibra te llenan más y regulan la digestión.');
  if(detalles.length)cc.appendChild(el('div','dr','<h4>📊 En números claros</h4>'+detalles.map(d=>'• '+d).join('<br>')));
  if(alt)cc.appendChild(el('div','swap','<b>Cámbialo por esto</b>'+alt));
  const b=el('button','btn','Agregar a mi día');
  b.onclick=()=>onAdd(a);
  cc.appendChild(b);
  cc.appendChild(el('div','aviso-salud','Ningún alimento está prohibido. Lo que define tu salud es lo que comes casi siempre, no lo que comes de vez en cuando.'));
  abrir('#capaInfo');
}

let filtroNiv=0;
abrirAlimentos=function(){
  $('#infoTitulo').textContent='Agregar comida';
  const cc=$('#infoCuerpo');cc.innerHTML='';
  const inp=document.createElement('input');
  inp.className='buscar';inp.placeholder='Buscar alimento';
  const chips=el('div','chips');
  const cont=el('div');
  const agregar=a=>{
    const n=parseFloat(prompt('¿Cuántas porciones de '+a[0]+'? ('+a[1]+')','1'));
    if(!(n>0&&n<=20))return;
    const f=hoyClave(),d=comidas[f]||{items:[],agua:0};
    d.items.push({nom:a[0],por:a[1],n:n,k:a[2],p:a[3],c:a[4],g:a[5],sat:a[6],az:a[7],so:a[8],fi:a[9],niv:a[10]});
    comidas[f]=d;grabar(KD.c,comidas);cerrar('#capaInfo');pintarDieta();avisar(a[0]+' agregado');
  };
  const pinta=()=>{
    cont.innerHTML='';
    const q=inp.value.toLowerCase().trim();
    const l=ALIM.filter(a=>(!q||a[0].toLowerCase().includes(q))&&(!filtroNiv||a[10]===filtroNiv));
    if(!l.length)cont.appendChild(el('div','vacio','No está en la lista. Busca algo parecido.'));
    l.forEach(a=>{
      const r=el('button','comida');
      r.innerHTML='<span class="semaforo" style="background:'+NIVCOL[a[10]]+'"></span>'+
        '<div class="crece"><b>'+a[0]+'</b><small>'+a[1]+' · '+a[3]+'P '+a[4]+'C '+a[5]+'G · '+NIVTXT[a[10]]+'</small></div>'+
        '<div class="kcal">'+a[2]+'</div>';
      r.onclick=()=>fichaAlimento(a,agregar);
      cont.appendChild(r);
    });

function analisisDia(){
  const f=hoyClave(),l=comidas[f]||{items:[]};
  const t={sat:0,az:0,so:0,fi:0,p:0,k:0};
  l.items.forEach(i=>{t.sat+=(i.sat||0)*i.n;t.az+=(i.az||0)*i.n;t.so+=(i.so||0)*i.n;
    t.fi+=(i.fi||0)*i.n;t.p+=i.p*i.n;t.k+=i.k*i.n});
  const v=[];
  const plan=perfil?calcularPlan(perfil):null;
  if(!l.items.length)return null;
  v.push(t.sat>LIM.sat
    ? ['⚠️','Grasa saturada alta: '+Math.round(t.sat)+' g cuando el límite ronda los '+LIM.sat+' g. Mantenerla moderada la mayoría de los días puede ayudar a cuidar el colesterol.']
    : ['✅','Grasa saturada bajo control: '+Math.round(t.sat)+' g de un límite de '+LIM.sat+' g.']);
  v.push(t.az>LIM.az

    : ['✅','Azúcar en buen rango: '+Math.round(t.az)+' g.']);
  v.push(t.so>LIM.so

    : ['✅','Sodio controlado: '+Math.round(t.so)+' mg de '+LIM.so+' mg.']);
  v.push(t.fi<LIM.fi
    ? ['🥬','Te falta fibra: llevas '+Math.round(t.fi)+' g de los '+LIM.fi+' g recomendados. Habichuelas, víveres y frutas enteras la suben rápido.']
    : ['✅','Buena fibra: '+Math.round(t.fi)+' g. Tu intestino y tu colesterol lo agradecen.']);
  if(plan)v.push(t.p<plan.prot*0.8

}

function sugerirPeso(ejId){

  const prev=[];
  for(const s of historial){
    const b=s.ej.find(x=>x.ej===ejId);

  }
  if(!prev.length)return null;
  const u=prev[0].sets.filter(x=>x.hecho||true);
  const pesos=u.map(x=>+x.peso||0),reps=u.map(x=>+x.reps||0);
  const maxP=Math.max(...pesos);if(!maxP)return null;
  const seriesTope=u.filter(x=>(+x.peso||0)>=maxP&&(+x.reps||0)>=Math.max(...reps)).length;

}

function activarPrograma(id){
  progEst={id:id,semana:1,hechos:[]};grabar(KP.pr,progEst);

function tarjetaPrograma(p,soloInfo){
  const t=el('div','prog-card');pintaColor(t,p.color);
  const act=progEst&&progEst.id===p.id;
  const total=p.sem*p.dias,hechos=act?progEst.hechos.length:0;
  t.innerHTML='<span class="em">'+p.emoji+'</span><h3>'+p.nom+'</h3>'+
    '<div class="met">'+p.sem+' semanas · '+p.dias+' días por semana · '+p.nivel+'</div>'+
    '<p>'+p.desc+'</p>'+
    (act?'<div class="barra"><i style="width:'+(hechos/total*100)+'%"></i></div><div class="met">Semana '+progEst.semana+' de '+p.sem+' · '+hechos+' de '+total+' entrenamientos</div>':'');
  if(!soloInfo){
    const b=el('button');
    b.style.cssText='margin-top:12px;width:100%;padding:13px;border-radius:100px;background:#fff;font-family:var(--disp);font-weight:700;font-size:15px;color:'+cg(p.color);

function verPrograma(p){
  $('#infoTitulo').textContent=p.nom;
  const c=$('#infoCuerpo');c.innerHTML='';

  p.bloques.forEach(b=>c.appendChild(el('div','gsec','<p>'+b+'</p>')).style.setProperty('--c',cg(p.color)));
  c.appendChild(el('div','etq','Semana '+progEst.semana));
  p.plan.forEach((d,i)=>{
    const clave=progEst.semana+'-'+i;
    const hecho=progEst.hechos.includes(clave);
    const f=el('button','dia-card'+(hecho?' hecho':''));
    f.style.setProperty('--c',cg(p.color));
    f.innerHTML='<div class="num">'+(hecho?'✓':(i+1))+'</div><div class="crece"><b>'+d.n+'</b><small>'+d.ej.length+' ejercicios · '+d.ej.reduce((a,x)=>a+x[1],0)+' series</small></div><span>›</span>';
    f.onclick=()=>{

  });

  const next=el('button','btn fantasma','Siguiente semana ›');

  prev.style.margin='0';next.style.margin='0';

    nombre:p.nom+' · '+d.n,inicio:Date.now(),fin:null,objetivos:{},
    ej:d.ej.map(([e,s,r,desc])=>{sesion&&0;return{ej:e,descanso:desc,reps:r,
      sets:Array.from({length:s},()=>({peso:'',reps:'',min:'',hecho:false}))}})};

<script>
/* =========================================================
   MÓDULO 5 — tarjeta para compartir

function tarjetaImagen(s){
  const W=1080,H=1350,cv=document.createElement('canvas');
  cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#7B5CFF');g.addColorStop(.55,'#FF4D6D');g.addColorStop(1,'#FF8A3D');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalAlpha=.13;x.fillStyle='#fff';
  x.beginPath();x.arc(920,180,260,0,7);x.fill();
  x.beginPath();x.arc(120,1180,300,0,7);x.fill();
  x.globalAlpha=1;

  x.fillStyle='#fff';x.textAlign='left';
  x.font='800 42px "Bricolage Grotesque", sans-serif';
  x.fillText('PULSO',90,150);
  x.beginPath();x.arc(72,136,13,0,7);x.fill();

  x.globalAlpha=.85;x.font='600 34px Outfit, sans-serif';
  x.fillText(new Date(s.fin).toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'}).toUpperCase(),90,250);
  x.globalAlpha=1;

  x.font='800 78px "Bricolage Grotesque", sans-serif';
  const nom=s.nombre.length>22?s.nombre.slice(0,22)+'…':s.nombre;
  x.fillText(nom,90,370);

  const stats=[[s.minutos,'MINUTOS'],[s.volumen.toLocaleString('es-DO'),'KG MOVIDOS'],
    [s.ej.reduce((a,b)=>a+b.sets.length,0),'SERIES']];
  let y=560;
  stats.forEach(([v,t])=>{
    x.globalAlpha=.35;x.fillRect(90,y-4,900,3);x.globalAlpha=1;
    x.font='800 130px "Bricolage Grotesque", sans-serif';
    x.fillText(String(v),90,y+130);
    x.globalAlpha=.85;x.font='600 32px Outfit, sans-serif';
    x.textAlign='right';x.fillText(t,990,y+120);x.textAlign='left';x.globalAlpha=1;
    y+=210;
  });

  x.globalAlpha=.8;x.font='500 30px Outfit, sans-serif';
  x.fillText('Registrado con PULSO',90,H-90);
  x.globalAlpha=1;
  return cv;
}
async function compartirSesion(s){
  const cv=tarjetaImagen(s);
  cv.toBlob(async b=>{
    if(!b){avisar('No se pudo generar');return}
    const f=new File([b],'pulso.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:'Mi entrenamiento'})}catch(e){}
    }else{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);a.download='pulso-'+new Date(s.fin).toISOString().slice(0,10)+'.png';a.click();
      avisar('Imagen descargada');
    }
  },'image/png');

<script>
/* =========================================================

const sinTilde=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const NUMS={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,
  media:.5,medio:.5,'1/2':.5,mitad:.5,poquito:.5,poco:.5,bastante:1.5,mucho:2};
const SINON={
 arroz:'Arroz blanco',habichuela:'Habichuelas guisadas',habichuelas:'Habichuelas guisadas',
 pollo:'Pollo guisado',pechuga:'Pechuga a la plancha',carne:'Res guisada',res:'Res guisada',
 cerdo:'Chuleta de cerdo',chuleta:'Chuleta de cerdo',pescado:'Pescado frito',
 platano:'Plátano maduro frito',maduro:'Plátano maduro frito',tostones:'Tostones',
 mangu:'Mangú',mofongo:'Mofongo',sancocho:'Sancocho',moro:'Moro de guandules',
 locrio:'Locrio de pollo',espagueti:'Espagueti guisado',spaghetti:'Espagueti guisado',
 huevo:'Huevo hervido',huevos:'Huevo hervido',queso:'Queso de freír',salami:'Salami frito',
 chicharron:'Chicharrón',yuca:'Yuca hervida',papa:'Papa hervida',batata:'Batata hervida',
 viveres:'Víveres hervidos',ensalada:'Ensalada verde',aguacate:'Aguacate',
 pan:'Pan de agua',avena:'Avena cocida',leche:'Leche entera',yogur:'Yogur natural',
 cafe:'Café con leche',jugo:'Jugo natural sin azúcar',refresco:'Refresco',coca:'Refresco',
 agua:'Agua',cerveza:'Cerveza',guineo:'Guineo',manzana:'Manzana',china:'Naranja',
 naranja:'Naranja',lechosa:'Lechosa',pina:'Piña',mango:'Mango',
 empanada:'Empanada',quipe:'Quipe',pastelito:'Pastelito',pizza:'Pizza',
 hamburguesa:'Hamburguesa',papas:'Papas fritas',fritas:'Papas fritas',
 atun:'Atún en agua',sardina:'Sardina en aceite',camarones:'Camarones',
 bacalao:'Bacalao guisado',mani:'Maní',chocolate:'Chocolate',helado:'Helado',
 galletas:'Galletas de soda',maiz:'Maíz',repollo:'Ensalada de repollo',
 morir:'Morir soñando',chinola:'Jugo de chinola',sopa:'Sopa de pollo',
 proteina:'Proteína en polvo',batida:'Proteína en polvo'
};
function buscaAlimento(frag){
  const t=sinTilde(frag).replace(/[^a-z0-9\s\/]/g,' ').split(/\s+/).filter(Boolean);
  for(const p of t)if(SINON[p])return ALIM.find(a=>a[0]===SINON[p]);
  let mejor=null,pts=0;
  ALIM.forEach(a=>{
    const n=sinTilde(a[0]).split(/\s+/);
    let s=0;
    t.forEach(p=>{if(p.length<3)return;n.forEach(w=>{if(w===p)s+=2;else if(w.startsWith(p)||p.startsWith(w))s+=1})});
    if(s>pts){pts=s;mejor=a}
  });
  return pts>=2?mejor:null;
}
function cantidadDe(frag){
  const t=sinTilde(frag).split(/\s+/);
  for(const p of t){
    if(NUMS[p]!=null)return NUMS[p];
    const n=parseFloat(p.replace(',','.'));
    if(!isNaN(n)&&n>0&&n<=20)return n;
  }
  return 1;
}
function analizarTexto(txt){
  const partes=sinTilde(txt).split(/\s+(?:con|y|mas|además|ademas)\s+|[,+]/).map(s=>s.trim()).filter(Boolean);
  const encontrados=[],perdidos=[];
  partes.forEach(p=>{
    const a=buscaAlimento(p);
    if(a)encontrados.push({a,n:cantidadDe(p)});else if(p.length>2)perdidos.push(p);
  });
  return {encontrados,perdidos};
}
function veredictoComida(items){
  const t={k:0,p:0,c:0,g:0,sat:0,az:0,so:0,fi:0};
  items.forEach(({a,n})=>{t.k+=a[2]*n;t.p+=a[3]*n;t.c+=a[4]*n;t.g+=a[5]*n;
    t.sat+=a[6]*n;t.az+=a[7]*n;t.so+=a[8]*n;t.fi+=a[9]*n});
  const plan=perfil?calcularPlan(perfil):null;
  const v=[];
  let puntos=0;
  if(t.sat>LIM.sat*0.5){v.push(['⚠️','Esta comida sola trae '+Math.round(t.sat)+' g de grasa saturada, más de la mitad de todo tu día. Repetido a diario, esto es lo que sube el colesterol y tapa las arterias.'])}
  else{v.push(['✅','Grasa saturada bajo control: '+Math.round(t.sat)+' g.']);puntos++}
  if(t.so>900){v.push(['⚠️','Mucha sal: '+Math.round(t.so)+' mg de sodio. El límite del día entero son 2.300 mg. El exceso sube la presión arterial.'])}
  else{v.push(['✅','Sodio razonable: '+Math.round(t.so)+' mg.']);puntos++}
  if(t.az>25){v.push(['⚠️','Trae '+Math.round(t.az)+' g de azúcar, como '+Math.round(t.az/4)+' cucharaditas. Eso dispara la insulina y en un rato te da hambre otra vez.'])}
  else{v.push(['✅','Poca azúcar: '+Math.round(t.az)+' g.']);puntos++}
  if(t.p<15){v.push(['🍗','Le falta proteína: solo '+Math.round(t.p)+' g. Sin proteína no reparas músculo y el plato no te llena. Agrégale pollo, huevo o atún.'])}
  else{v.push(['✅','Buena proteína: '+Math.round(t.p)+' g.']);puntos++}
  if(t.fi<5){v.push(['🥬','Casi sin fibra ('+Math.round(t.fi)+' g). Súmale ensalada, habichuelas o una fruta y digieres mejor.'])}
  else{v.push(['✅','Trae fibra: '+Math.round(t.fi)+' g.']);puntos++}
  if(plan){
    const pc=Math.round(t.k/plan.kcal*100);
    v.unshift([pc>45?'📊':'📊','Son '+Math.round(t.k)+' kcal, el '+pc+'% de tu meta del día ('+plan.kcal+' kcal).'+(pc>45?' Es una comida grande; ajusta el resto del día.':'')]);
  }
  const nivel=puntos>=4?3:puntos>=2?2:1;
  const titulo=nivel===3?'Buena comida':nivel===2?'Se puede mejorar':'Comida pesada';
  return {t,v,nivel,titulo};
}
function abrirEscribir(){
  $('#infoTitulo').textContent='¿Qué comiste?';
  const c=$('#infoCuerpo');c.innerHTML='';
  c.appendChild(el('div','vacio','Escríbelo como lo dirías normal.<br>Ejemplo: <b>dos tazas de arroz con habichuelas y pollo guisado</b>'));

    out.innerHTML='';
    if(!encontrados.length){
      out.appendChild(el('div','vacio','No reconocí ningún alimento. Prueba con nombres más simples, como "arroz", "pollo", "tostones".'));
      return;
    }
    const r=veredictoComida(encontrados);
    const col=NIVCOL[r.nivel];
    const cab=el('div','rut-tarjeta');
    cab.style.background='linear-gradient(135deg,'+col+','+col+'cc)';
    cab.innerHTML='<div class="etq" style="color:rgba(255,255,255,.9)">'+NIVTXT[r.nivel]+'</div><h3>'+r.titulo+'</h3>'+
      '<div class="mini-stats" style="margin-top:14px">'+
      '<div><b>'+Math.round(r.t.k)+'</b><small>kcal</small></div>'+
      '<div><b>'+Math.round(r.t.p)+'</b><small>g proteína</small></div>'+
      '<div><b>'+Math.round(r.t.sat)+'</b><small>g saturada</small></div></div>';
    out.appendChild(cab);
    out.appendChild(el('div','etq','Lo que entendí'));
    encontrados.forEach(({a,n})=>{
      const f=el('div','comida');
      f.innerHTML='<span class="semaforo" style="background:'+NIVCOL[a[10]]+'"></span>'+
        '<div class="crece"><b>'+a[0]+'</b><small>'+n+' × '+a[1]+'</small></div><div class="kcal">'+Math.round(a[2]*n)+'</div>';
      out.appendChild(f);
    });
    if(perdidos.length)out.appendChild(el('div','vacio','No reconocí: '+perdidos.join(', ')));
    out.appendChild(el('div','diario','<h4>🩺 Qué opino de esta comida</h4>'+
      r.v.map(([i,t])=>'<div class="veredicto"><span class="ic">'+i+'</span><span>'+t+'</span></div>').join('')));
    const g=el('button','btn','Guardar en mi día');
    g.onclick=()=>{
      const f=hoyClave(),d=comidas[f]||{items:[],agua:0};
      encontrados.forEach(({a,n})=>d.items.push({nom:a[0],por:a[1],n:n,k:a[2],p:a[3],c:a[4],g:a[5],sat:a[6],az:a[7],so:a[8],fi:a[9],niv:a[10]}));
      comidas[f]=d;grabar(KD.c,comidas);cerrar('#capaInfo');pintarDieta();avisar('Comida guardada');
    };
    out.appendChild(g);
    out.appendChild(el('div','aviso-salud','Las cantidades son estimadas a partir de porciones estándar. Si quieres precisión, agrega los alimentos uno por uno.'));
  };
  c.appendChild(b);c.appendChild(out);
  abrir('#capaInfo');
}

/* nivel de un producto según sus nutrientes por 100 g */
function nivelDe(sat,az,so,fi,p){
  let m=0;
  if(sat>=5)m+=2;else if(sat>=2)m+=1;
  if(az>=15)m+=2;else if(az>=7)m+=1;
  if(so>=600)m+=2;else if(so>=300)m+=1;
  if(fi>=4)m-=1;
  if(p>=15)m-=1;
  return m>=3?1:m>=1?2:3;
}

async function buscarProducto(codigo){
  $('#infoTitulo').textContent='Buscando…';
  const c=$('#infoCuerpo');c.innerHTML='<div class="vacio">Consultando la base de datos mundial de alimentos…</div>';
  abrir('#capaInfo');
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(codigo)+'.json?fields=product_name,brands,nutriments,serving_size,quantity');
    const j=await r.json();
    if(!j.product||j.status===0){
      c.innerHTML='';
      c.appendChild(el('div','vacio','Ese producto no está en la base de datos.<br>Puedes agregarlo a mano desde la lista de alimentos.'));
      const b=el('button','btn','Volver a la lista');b.onclick=()=>{cerrar('#capaInfo');setTimeout(abrirAlimentos,280)};
      c.appendChild(b);return;
    }
    const p=j.product,n=p.nutriments||{};
    const val=k=>+(n[k+'_100g']||0);
    const a=[
      (p.product_name||'Producto')+(p.brands?' · '+p.brands.split(',')[0]:''),
      '100 g',
      Math.round(val('energy-kcal')||val('energy')/4.184||0),
      +val('proteins').toFixed(1),+val('carbohydrates').toFixed(1),+val('fat').toFixed(1),
      +val('saturated-fat').toFixed(1),+val('sugars').toFixed(1),
      Math.round(val('sodium')*1000||val('salt')*400),+val('fiber').toFixed(1)
    ];
    a[10]=nivelDe(a[6],a[7],a[8],a[9],a[3]);
    a[11]=explicarProducto(a);
    a[12]='';
    if(!a[2]){c.innerHTML='';c.appendChild(el('div','vacio','Ese producto está en la base pero sin información nutricional.'));return}
    fichaAlimento(a,ag=>{
      const g=parseFloat(prompt('¿Cuántos gramos comiste de '+a[0]+'?','100'));
      if(!(g>0&&g<=2000))return;
      const n2=g/100;
      const f=hoyClave(),d=comidas[f]||{items:[],agua:0};
      d.items.push({nom:a[0],por:g+' g',n:1,k:a[2]*n2,p:a[3]*n2,c:a[4]*n2,g:a[5]*n2,
        sat:a[6]*n2,az:a[7]*n2,so:a[8]*n2,fi:a[9]*n2,niv:a[10]});
      comidas[f]=d;grabar(KD.c,comidas);cerrar('#capaInfo');pintarDieta();avisar('Producto agregado');
    });
  }catch(e){
    c.innerHTML='';
    c.appendChild(el('div','vacio','No hay conexión para consultar el producto. Intenta más tarde.'));
  }
}
function explicarProducto(a){
  const [nom,,k,p,cb,g,sat,az,so,fi,niv]=a;
  const t=[];
  if(sat>=5)t.push('Tiene '+sat+' g de grasa saturada por cada 100 g, que es bastante: esa es la grasa que sube el colesterol malo.');
  else if(sat>=2)t.push('Grasa saturada moderada ('+sat+' g por 100 g).');
  else t.push('Muy poca grasa saturada, eso juega a favor de tu corazón.');
  if(az>=15)t.push('Trae '+az+' g de azúcar por cada 100 g, casi cuatro cucharaditas. Es de los productos que conviene dejar para de vez en cuando.');
  else if(az>=7)t.push('Azúcar moderada ('+az+' g por 100 g).');
  if(so>=600)t.push('Mucho sodio ('+so+' mg por 100 g): eso presiona el corazón y sube la presión arterial.');
  if(p>=15)t.push('Buena proteína ('+p+' g), útil después de entrenar.');
  if(fi>=4)t.push('Aporta fibra ('+fi+' g), que llena y ayuda a la digestión.');
  return t.join(' ');
}

function angulo(a,b,c){
  const ab=[a.x-b.x,a.y-b.y],cb=[c.x-b.x,c.y-b.y];
  const d=ab[0]*cb[0]+ab[1]*cb[1];
  const m=Math.hypot(...ab)*Math.hypot(...cb);
  if(!m)return 180;
  return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI;
}
let visLand=null,visStream=null,visRAF=null,visOn=false;
let visEj='sentadilla',visReps=0,visFase='arriba',visMin=180,visSerie=[];

async function abrirVision(){
  const v=$('#vision');v.classList.add('on');
  visReps=0;visFase='arriba';visMin=180;visSerie=[];
  $('#visN').textContent='0';
  $('#visFeed').textContent='Cargando el detector… la primera vez tarda unos segundos.';
  const vid=$('#visVid'),cv=$('#visCv'),cx=cv.getContext('2d');
  try{
    visStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    vid.srcObject=visStream;await vid.play();
  }catch(e){
    $('#visFeed').textContent='No pude usar la cámara. Revisa que le hayas dado permiso a la app.';return;
  }
  try{
    const vis=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const fs=await vis.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    visLand=await vis.PoseLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},
      runningMode:'VIDEO',numPoses:1
    });
  }catch(e){
    $('#visFeed').textContent='No se pudo cargar el detector. Necesitas internet la primera vez.';return;
  }
  $('#visFeed').textContent='Ponte de cuerpo entero frente a la cámara y empieza.';
  visOn=true;
  const HUESOS=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
  let ultimo=-1;
  const bucle=()=>{
    if(!visOn)return;
    if(vid.readyState>=2){
      if(cv.width!==vid.videoWidth){cv.width=vid.videoWidth;cv.height=vid.videoHeight}
      const t=performance.now();
      if(t-ultimo>40){
        ultimo=t;
        const res=visLand.detectForVideo(vid,t);
        cx.clearRect(0,0,cv.width,cv.height);
        if(res.landmarks&&res.landmarks[0]){
          const L=res.landmarks[0],W=cv.width,H=cv.height;
          cx.strokeStyle='rgba(0,204,106,.9)';cx.lineWidth=Math.max(3,W/160);cx.lineCap='round';
          HUESOS.forEach(([a,b])=>{
            if(L[a].visibility<.4||L[b].visibility<.4)return;
            cx.beginPath();cx.moveTo(L[a].x*W,L[a].y*H);cx.lineTo(L[b].x*W,L[b].y*H);cx.stroke();
          });
          cx.fillStyle='#fff';
          L.forEach((p,i)=>{if(i>10&&p.visibility>.4){cx.beginPath();cx.arc(p.x*W,p.y*H,Math.max(3,W/200),0,7);cx.fill()}});
          contar(L);
        }
      }
    }
    visRAF=requestAnimationFrame(bucle);
  };
  bucle();
}
function contar(L){
  const cfg=EJVIS[visEj],[a,b,c]=cfg.art;
  if(L[a].visibility<.4||L[b].visibility<.4||L[c].visibility<.4){
    $('#visFeed').textContent='No te veo completo. Aléjate un poco para que quepa todo el cuerpo.';return;
  }
  const ang=angulo(L[a],L[b],L[c]);
  if(ang<visMin)visMin=ang;
  if(visFase==='arriba'&&ang<cfg.abajo){visFase='abajo'}
  else if(visFase==='abajo'&&ang>cfg.arriba){
    visFase='arriba';visReps++;
    const prof=visMin;visSerie.push(Math.round(prof));visMin=180;
    $('#visN').textContent=visReps;
    try{navigator.vibrate&&navigator.vibrate(45)}catch(e){}
    $('#visFeed').textContent=prof>cfg.abajo-6?('Repetición '+visReps+'. '+cfg.corto):('Repetición '+visReps+'. Buena profundidad, sigue así.');
  }else if(visFase==='arriba'){
    $('#visFeed').textContent=cfg.tip;
  }
}
function cerrarVision(guardar){
  visOn=false;cancelAnimationFrame(visRAF);
  try{visStream&&visStream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{visLand&&visLand.close&&visLand.close()}catch(e){}
  visLand=null;visStream=null;
  $('#vision').classList.remove('on');
  if(guardar&&visReps){
    const mapa={sentadilla:'g11',flexion:'p6',curl:'b2',press:'h2',zancada:'g14'};
    const id=mapa[visEj];
    if(!sesion)iniciarSesion(null);
    let b=sesion.ej.find(x=>x.ej===id);
    if(!b){b={ej:id,descanso:ajustes.descanso,sets:[]};sesion.ej.push(b)}
    b.sets.push({peso:'',reps:String(visReps),min:'',hecho:true});
    guardarSesion();abrirEntrenamiento();
    avisar(visReps+' repeticiones guardadas');
  }
}

})();

/* ---------------- onboarding progresivo ---------------- */
let pIdx=0;
function pintarPlanPaso(){
  const d=$('#onb'),p=PLAN_PASOS[pIdx];
  d.querySelector('.puntos').innerHTML=PLAN_PASOS.map((_,i)=>'<i class="'+(i<=pIdx?'on':'')+'"></i>').join('');
  d.querySelector('h2').textContent=p.t;
  d.querySelector('.sub').textContent=p.s;
  let atras=d.querySelector('.atras');
  if(!atras){atras=el('button','atras','‹');d.querySelector('.top').appendChild(atras)}
  atras.style.display=pIdx?'grid':'none';
  atras.onclick=()=>{if(pIdx>0){pIdx--;guardarProg();pintarPlanPaso()}};
  const c=d.querySelector('.cuerpo');c.innerHTML='';
  p.ops.forEach(([v,t])=>{
    const b=el('button','op'+(onbProg.resp[p.k]===v?' sel':''),t);
    b.onclick=()=>{
      onbProg.resp[p.k]=v;guardarProg();
      [...c.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
      setTimeout(()=>{pIdx<PLAN_PASOS.length-1?(pIdx++,guardarProg(),pintarPlanPaso()):planListo()},260);
    };
    c.appendChild(b);
  });
  $('#onbSig').style.display='none';
  $('#onbSalt').textContent='Ahora no, quiero explorar';
}
function guardarProg(){onbProg.paso=pIdx;grabar(KO.p,onbProg)}
function abrirPlan(){
  pIdx=Math.min(onbProg.paso||0,PLAN_PASOS.length-1);
  const d=$('#onb');d.classList.add('on');
  $('#onbSig').onclick=null;
  $('#onbSalt').onclick=()=>{d.classList.remove('on');avisar('Puedes crear tu plan cuando quieras')};
  d.querySelector('.cerrarc')&&0;
  pintarPlanPaso();
}
function recomendarPrograma(r){
  if(r.lugar==='casa')return 'casa';
  if(r.objetivo==='musculo'&&+r.dias>=4)return 'volumen';
  if(r.objetivo==='grasa'&&+r.dias>=4)return 'volumen';
  return 'fuerza';
}
function planListo(){
  const d=$('#onb'),r=onbProg.resp;
  d.querySelector('.puntos').innerHTML=PLAN_PASOS.map(()=>'<i class="on"></i>').join('');
  d.querySelector('h2').textContent='Perfecto';
  d.querySelector('.sub').textContent='Ya tenemos suficiente para empezar.';
  const at=d.querySelector('.atras');if(at)at.style.display='none';
  const p=progPorId(recomendarPrograma(r));
  const c=d.querySelector('.cuerpo');c.innerHTML='';
  const caja=el('div','listo-caja','<div class="tick">✅</div>');
  c.appendChild(caja);
  const t=el('div','op');
  t.style.cssText='background:#fff;color:#171340;padding:20px';
  t.innerHTML='<div style="font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em">'+p.emoji+'  '+p.nom+'</div>'+
    '<div style="font-size:13.5px;color:#7B77A6;margin:4px 0 10px">'+p.sem+' semanas · '+p.dias+' días por semana</div>'+
    '<div style="font-size:14.5px;line-height:1.5">'+p.desc+'</div>';
  c.appendChild(t);
  const notas={grasa:'Con tu objetivo de perder grasa, la clave está tanto en entrenar como en lo que comes. Puedes activar el conteo de calorías cuando quieras.',
   musculo:'Para ganar músculo necesitas comer suficiente proteína. Cuando quieras, calcula tus números en la pestaña Dieta.',
   fuerza:'Tu progreso se mide en peso levantado. Usa la calculadora de 1RM para ver tu nivel.',
   condicion:'Combina las sesiones con algo de cardio y vas a notar el cambio en pocas semanas.',
   mantener:'Mantenerse también es una meta válida y la constancia es lo único que hace falta.'}[r.objetivo];
  if(notas)c.appendChild(el('div','op',notas)).style.fontSize='14.3px';
  $('#onbSig').style.display='block';
  $('#onbSig').textContent='Ver mi plan';
  $('#onbSig').disabled=false;
  $('#onbSig').onclick=()=>{
    onb=Object.assign(onb||{},r,{explorando:false,hecho:true});
    grabar(KP.o,onb);
    activarPrograma(p.id);
    onbProg={paso:0,resp:r};grabar(KO.p,onbProg);
    d.classList.remove('on');
    irA('rutinas');
  };
  $('#onbSalt').textContent='Ahora no';
  $('#onbSalt').onclick=()=>{d.classList.remove('on')};
}

/* ---------------- sugerir un alimento ---------------- */
function abrirSugerirAlimento(){
  $('#infoTitulo').textContent='Sugerir un alimento';
  const c=$('#infoCuerpo');c.innerHTML='';
  c.appendChild(el('div','sug-caja','<h4>🍽 ¿Falta algo que tú comes?</h4><p>Dinos cuál es y lo agregamos a la app para todo el mundo. Además queda guardado en tu lista de una vez, así lo puedes usar desde hoy.</p>'));
  c.appendChild(el('div','campo','<label class="etq">¿Qué comida es? *</label><input id="sg-nom" placeholder="Ej. Arepa de queso" autocomplete="off">'));
  c.appendChild(el('div','campo','<label class="etq">Porción normal *</label><input id="sg-por" placeholder="Ej. 1 unidad, 1 taza, 100 g" autocomplete="off">'));
  c.appendChild(el('div','sug-caja','<h4>Si sabes los valores, ponlos</h4><p>Están en la etiqueta del producto. Si no los sabes, déjalos vacíos: nosotros los buscamos.</p>'));
  const g1=el('div','dos');
  g1.innerHTML='<div class="campo"><label class="etq">Calorías</label><input id="sg-k" type="number" inputmode="numeric" placeholder="kcal"></div>'+
               '<div class="campo"><label class="etq">Proteína (g)</label><input id="sg-p" type="number" inputmode="decimal" placeholder="g"></div>';
  c.appendChild(g1);
  const g2=el('div','dos');g2.style.marginTop='9px';
  g2.innerHTML='<div class="campo"><label class="etq">Carbohidratos (g)</label><input id="sg-c" type="number" inputmode="decimal" placeholder="g"></div>'+
               '<div class="campo"><label class="etq">Grasa (g)</label><input id="sg-g" type="number" inputmode="decimal" placeholder="g"></div>';
  c.appendChild(g2);
  const g3=el('div','dos');g3.style.marginTop='9px';
  g3.innerHTML='<div class="campo"><label class="etq">Grasa saturada (g)</label><input id="sg-sat" type="number" inputmode="decimal" placeholder="g"></div>'+
               '<div class="campo"><label class="etq">Azúcar (g)</label><input id="sg-az" type="number" inputmode="decimal" placeholder="g"></div>';
  c.appendChild(g3);
  c.appendChild(el('div','campo','<label class="etq">¿De dónde es? (opcional)</label><input id="sg-pais" placeholder="Ej. Colombia, Japón, España" autocomplete="off">'));
  c.appendChild(el('div','campo','<label class="etq">Algo más que debamos saber</label><input id="sg-nota" placeholder="Cómo se prepara, marca, etc." autocomplete="off">'));

  const val=()=>{
    const v=x=>$(x).value.trim();
    const n=x=>parseFloat($(x).value)||0;
    if(!v('#sg-nom')||!v('#sg-por')){avisar('Pon al menos el nombre y la porción');return null}
    return {nom:v('#sg-nom'),por:v('#sg-por'),k:n('#sg-k'),p:n('#sg-p'),c:n('#sg-c'),
      g:n('#sg-g'),sat:n('#sg-sat'),az:n('#sg-az'),pais:v('#sg-pais'),nota:v('#sg-nota')};
  };

  const guardar=el('button','btn','Guardar en mi lista');
  guardar.onclick=()=>{
    const d=val();if(!d)return;
    if(!d.k){avisar('Para guardarlo necesitas al menos las calorías');return}
    const niv=nivelPor100({sat:d.sat,az:d.az,so:0,fi:0,p:d.p});
    const fila=[d.nom,d.por,Math.round(d.k),d.p,d.c,d.g,d.sat,d.az,0,0,niv,
      'Alimento que agregaste tú. Los valores son los que escribiste, así que revísalos si algo no cuadra.'+(d.nota?' Nota: '+d.nota:''),''];
    misAlimentos.push(fila);grabar(KM.a,misAlimentos);
    if(!ALIM.some(x=>x[0]===fila[0])){ALIM.push(fila);ALIM.sort((a,b)=>a[0].localeCompare(b[0],'es'))}
    cerrar('#capaInfo');avisar('"'+d.nom+'" ya está en tu lista');

  const armar=()=>{
    const d=val();if(!d)return null;
    const l=['SUGERENCIA DE ALIMENTO','','Nombre: '+d.nom,'Porción: '+d.por];
    if(d.k)l.push('Calorías: '+d.k);
    if(d.p)l.push('Proteína: '+d.p+' g');
    if(d.c)l.push('Carbohidratos: '+d.c+' g');
    if(d.g)l.push('Grasa: '+d.g+' g');
    if(d.sat)l.push('Grasa saturada: '+d.sat+' g');
    if(d.az)l.push('Azúcar: '+d.az+' g');
    if(d.pais)l.push('País: '+d.pais);
    if(d.nota)l.push('Nota: '+d.nota);
    return {a:'PULSO — Sugerencia: '+d.nom,b:l.join('\n')};
  };

  wa.onclick=()=>{const m=armar();if(m)enviarTexto(m.a,m.b).whatsapp()};
  env.appendChild(mail);env.appendChild(wa);
  c.appendChild(env);
  const cop=el('button','btn fantasma','Copiar el texto');
  cop.onclick=()=>{const m=armar();if(m)enviarTexto(m.a,m.b).copiar()};
  c.appendChild(cop);
  c.appendChild(el('div','vacio','No enviamos nada automáticamente: se abre tu app de correo o WhatsApp para que tú lo mandes.'));
  abrir('#capaInfo');
