/* ---------- redactor automático de la explicación ---------- */
function explicarAlimento(n,nom){
  const f=[];
  if(n.p>=20)f.push('Aporta bastante proteína ('+Math.round(n.p)+' g), que es el material con el que se reparan tus músculos');
  else if(n.p>=10)f.push('Tiene una cantidad decente de proteína ('+Math.round(n.p)+' g)');
  if(n.fi>=5)f.push('sus '+Math.round(n.fi)+' g de fibra te llenan más y ayudan al intestino y al colesterol');
  else if(n.fi>=3)f.push('aporta algo de fibra');
  const bueno=f.length?f.join(' y ')+'. ':'';

  const m=[];
  if(n.sat>=8)m.push('La grasa saturada está muy alta ('+n.sat.toFixed(1)+' g); consumirla en exceso de forma habitual puede elevar el colesterol LDL en algunas personas');
  else if(n.sat>=5)m.push('La grasa saturada es elevada ('+n.sat.toFixed(1)+' g), casi un cuarto de tu límite del día');
  if(n.az>=20)m.push('Trae bastante azúcar ('+Math.round(n.az)+' g, como '+Math.round(n.az/4)+' cucharaditas), que entra rápido a la sangre y no llena');
  else if(n.az>=10)m.push('El azúcar es notable ('+Math.round(n.az)+' g)');
  if(n.so>=800)m.push('El sodio es muy alto ('+Math.round(n.so)+' mg), y el sodio alto sostenido sube la presión arterial');
  else if(n.so>=400)m.push('Tiene bastante sodio ('+Math.round(n.so)+' mg)');
  if(n.k>=400&&n.p<10&&n.fi<3)m.push('Son muchas calorías para lo poco que llena');
  const malo=m.length?m.join('. ')+'. ':'';

  const niv=nivelPor100(n);
  const cierre=niv===3?'En conjunto es una buena opción para tener seguido.'
    :niv===2?'Está bien de vez en cuando, cuidando la cantidad.'
    :'Mejor déjalo para ocasiones, no para todos los días.';
  const base=(bueno+malo)||'Los valores son moderados en todo, sin nada que destaque ni para bien ni para mal. ';
  return base+cierre;
}
function alternativaAuto(n){
  if(n.sat>=8)return 'Busca una versión al horno o a la plancha en vez de frita: bajas casi toda la grasa saturada.';
  if(n.az>=20)return 'La versión sin azúcar añadida te da lo mismo sin el golpe de glucosa.';
  if(n.so>=800)return 'Una versión casera te deja controlar la sal, que es de donde viene casi todo el sodio.';
  return '';
}

/* ---------- consulta a la base de datos abierta ---------- */
async function investigarAlimento(nombre){
  const url='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(nombre)+
    '&search_simple=1&action=process&json=1&page_size=12'+
    '&fields=product_name,brands,quantity,serving_size,nutriments,countries';
  const r=await fetch(url);
  const j=await r.json();
  const out=[];
  (j.products||[]).forEach(p=>{
    if(!p.product_name)return;
    const nu=p.nutriments||{};
    const porS=nu['energy-kcal_serving'];
    const usarS=porS>0&&p.serving_size;
    const gv=(a,b)=>{const v=usarS?nu[a]:nu[b];return v==null?0:+(+v).toFixed(1)};
    const k=Math.round(usarS?porS:(nu['energy-kcal_100g']||0));
    if(!k)return;
    const so=(()=>{
      const s=usarS?nu['sodium_serving']:nu['sodium_100g'];
      if(s!=null)return Math.round(s*1000);
      const sal=usarS?nu['salt_serving']:nu['salt_100g'];
      return sal!=null?Math.round(sal*400):0;
    })();
    out.push({
      nom:p.product_name.trim(),marca:(p.brands||'').split(',')[0].trim(),
      por:usarS?p.serving_size:'100 g',
      n:{k:k,p:gv('proteins_serving','proteins_100g'),c:gv('carbohydrates_serving','carbohydrates_100g'),
         g:gv('fat_serving','fat_100g'),sat:gv('saturated-fat_serving','saturated-fat_100g'),
         az:gv('sugars_serving','sugars_100g'),so:so,fi:gv('fiber_serving','fiber_100g')}
    });
  });
  return out;
}

/* =========================================================
   MÓDULO 14 — diagnóstico y blindaje
   Captura errores reales y evita que un fallo tumbe la app.
   ========================================================= */
(function(){
  const K='pulso.errores';
  let errores=[];try{errores=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
  const guardar=()=>{try{localStorage.setItem(K,JSON.stringify(errores.slice(-25)))}catch(e){}};

  const registrar=(msg,fuente,linea,col)=>{
    const externo=fuente&&!fuente.includes(location.host);
    errores.push({m:String(msg).slice(0,300),f:fuente||'',l:linea||0,c:col||0,
      ext:!!externo,t:new Date().toISOString()});
    guardar();
  };

  window.addEventListener('error',e=>{
    registrar(e.message||'sin mensaje',e.filename,e.lineno,e.colno);
  },true);
  window.addEventListener('unhandledrejection',e=>{
    const r=e.reason;
    registrar('Promesa rechazada: '+((r&&r.message)||r),'',0,0);
  });

  /* verlo desde Ajustes */
  const btn=document.querySelector('#btnAjustes');
  if(btn){
    const orig=btn.onclick;
    btn.onclick=function(){
      orig&&orig.call(this);
      const c=document.querySelector('#infoCuerpo');if(!c)return;
      const b=document.createElement('button');
      b.className='btn fantasma';
      b.textContent='🔧  Diagnóstico ('+errores.length+')';
      b.onclick=()=>{
        document.querySelector('#infoTitulo').textContent='Diagnóstico';
        const cc=document.querySelector('#infoCuerpo');cc.innerHTML='';
        const inf=document.createElement('div');inf.className='dr';
        inf.innerHTML='<h4>Estado</h4>'+
          'Versión de la app: 1.0<br>'+
          'Navegador: '+(navigator.userAgent.slice(0,70))+'<br>'+
          'Sin conexión guardada: '+('serviceWorker' in navigator?'sí':'no')+'<br>'+
          'Cámara disponible: '+(navigator.mediaDevices?'sí':'no')+'<br>'+
          'Errores registrados: '+errores.length;
        cc.appendChild(inf);
        if(!errores.length){
          const v=document.createElement('div');v.className='vacio';
          v.textContent='Ningún error registrado. Todo funcionando.';
          cc.appendChild(v);
        }
        errores.slice().reverse().forEach(er=>{
          const d=document.createElement('div');d.className='dr';
          const arch=er.f?er.f.split('/').pop():'—';
          d.innerHTML='<h4>'+(er.ext?'⚠️ Recurso externo':'🐞 Error')+'</h4>'+
            '<div style="font-size:13.5px;line-height:1.5">'+
            '<b>'+er.m+'</b><br>'+
            (er.f?'Archivo: '+arch+(er.l?' · línea '+er.l:''):'')+
            '<br><span style="color:var(--tenue)">'+new Date(er.t).toLocaleString('es')+'</span>'+
            (er.ext?'<br><span style="color:var(--tenue)">Viene de una librería externa. Casi siempre no afecta a la app.</span>':'')+
            '</div>';
          cc.appendChild(d);

        lim.className='btn peligro';lim.textContent='Borrar registro';

<script>
/* ---------- porciones flexibles ---------- */
function porcionesDe(a){
  const p=(a[1]||'').toLowerCase();
  if(/\bg\b|gramo/.test(p)&&!/taza/.test(p)){
    const g=parseFloat(p)||100;
    return [[Math.round(g/2)+' g',0.5],[g+' g',1],[Math.round(g*1.5)+' g',1.5],[Math.round(g*2)+' g',2]];
  }
  if(/taza/.test(p))return [['½ taza',0.5],['1 taza',1],['1½ tazas',1.5],['2 tazas',2]];
  if(/unidad|rueda|lonja|rebanada|presa|pieza|bola|copa|lata|vaso|botella|cucharada|porción|plato|escalón|scoop/.test(p))
    return [['½',0.5],['1',1],['2',2],['3',3]];
  return [['½',0.5],['1',1],['1½',1.5],['2',2]];
}

/* ---------- ficha con lenguaje responsable ---------- */
fichaAlimento=function(a,onAdd){
  const [nom,por,k,p,c,g,sat,az,so,fi,niv,nota,alt]=a;
  const R=refDiarias();
  $('#infoTitulo').textContent=nom;
  const cc=$('#infoCuerpo');cc.innerHTML='';
  const col=NIVCOL[niv];
  const chip=el('div','nivchip','<span style="width:9px;height:9px;border-radius:50%;background:#fff"></span>'+NIVTXT[niv]);
  chip.style.background=col;cc.appendChild(chip);
  const sub=el('div','vacio','Porción de referencia: '+por+' · '+k+' kcal aprox.');
  sub.style.padding='0 0 10px';cc.appendChild(sub);
  const bar=(et,v,lim,color,uni)=>'<div class="nfila"><div class="et">'+et+'</div><div class="bb"><i style="width:'+Math.min(100,v/lim*100)+'%;background:'+color+'"></i></div><div class="vv">'+v+uni+'</div></div>';
  const n=el('div','nutri');
  n.innerHTML=bar('Proteína',p,50,'#00CC6A',' g')+
    bar('Carbohidratos',c,120,'#FFB020',' g')+
    bar('Grasa total',g,40,'#7B5CFF',' g')+
    bar('Grasa saturada',sat,R.sat,sat>=5?'#FF4D6D':'#FFB020',' g')+
    bar('Azúcar',az,R.az,az>=20?'#FF4D6D':'#FFB020',' g')+
    bar('Sodio',so,R.so,so>=600?'#FF4D6D':'#FFB020',' mg')+
    bar('Fibra',fi,R.fi,'#00C2A8',' g');
  cc.appendChild(n);
  cc.appendChild(el('div','dr','<h4>🩺 Qué aporta</h4>'+nota));
  const d=[];
  if(sat>=4)d.push('Cubre alrededor del '+Math.round(sat/R.sat*100)+'% de la grasa saturada de referencia para un día de '+R.base+' kcal.');
  if(az>=15)d.push('Aporta unos '+Math.round(az/4)+' cucharaditas de azúcar equivalentes.');
  if(so>=500)d.push('Suma cerca del '+Math.round(so/R.so*100)+'% del sodio de referencia del día.');
  if(p>=20)d.push('Con unos '+Math.round(p)+' g de proteína, contribuye bastante a tu total diario.');
  if(fi>=5)d.push('Sus '+Math.round(fi)+' g de fibra ayudan a la saciedad y al tránsito intestinal.');
  if(d.length)cc.appendChild(el('div','dr','<h4>📊 En contexto</h4>'+d.map(x=>'• '+x).join('<br>')+
    '<p style="margin-top:9px;color:var(--tenue);font-size:13px">Los porcentajes son referencias generales, no metas exactas. Dependen de tus calorías y de tu situación particular.</p>'));
  if(alt)cc.appendChild(el('div','swap','<b>Otra forma de prepararlo</b>'+alt));
  const b=el('button','btn','Agregar a mi día');
  b.onclick=()=>onAdd(a);
  cc.appendChild(b);
  cc.appendChild(el('div','aviso-salud','Los valores son aproximados y cambian según la preparación, el aceite usado y el tamaño real de la porción. Ningún alimento hay que eliminarlo: lo que define la alimentación es el conjunto y la frecuencia, no un plato en particular.'));
  abrir('#capaInfo');
};

/* ---------- selector de cantidad con porciones ---------- */
const cantPrev=pedirCantidad;
pedirCantidad=function(a,porGramos){
  cantPrev(a,porGramos);
  if(porGramos)return;
  const c=$('#infoCuerpo'),fila=c.querySelector('.cant');
  if(!fila)return;
  const inp=fila.querySelector('input');
  const chips=el('div','chips');chips.style.margin='0 0 4px';
  porcionesDe(a).forEach(([et,m])=>{
    const b=el('button','chip',et);
    b.style.setProperty('--c','#7B5CFF');
    b.onclick=()=>{
      [...chips.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');
      inp.value=m;inp.dispatchEvent(new Event('input'));
    };
    if(m===1)b.classList.add('on');
    chips.appendChild(b);
  });
  fila.parentNode.insertBefore(chips,fila);
};

/* ---------- análisis del día, sin alarmismo ---------- */
analisisDia=function(){
  const f=hoyClave(),l=comidas[f]||{items:[]};
  if(!l.items.length)return null;
  const R=refDiarias();
  const t={sat:0,az:0,so:0,fi:0,p:0,k:0};
  l.items.forEach(i=>{t.sat+=(i.sat||0)*i.n;t.az+=(i.az||0)*i.n;t.so+=(i.so||0)*i.n;
    t.fi+=(i.fi||0)*i.n;t.p+=i.p*i.n;t.k+=i.k*i.n});
  const v=[];
  v.push(t.sat>R.sat
    ? ['📌','Grasa saturada: '+Math.round(t.sat)+' g, por encima de los '+R.sat+' g de referencia para tus calorías. Mantenerla moderada la mayoría de los días puede ayudar a cuidar el colesterol.']
    : ['✅','Grasa saturada dentro de la referencia: '+Math.round(t.sat)+' g de unos '+R.sat+' g.']);
  v.push(t.az>R.az
    ? ['📌','Azúcar: '+Math.round(t.az)+' g, por encima de la referencia de '+R.az+' g. Conviene moderarla, sobre todo la de bebidas y dulces.']
    : ['✅','Azúcar en buen rango: '+Math.round(t.az)+' g.']);
  v.push(t.so>R.so
    ? ['📌','Sodio: '+Math.round(t.so)+' mg, por encima de los 2.300 mg que se suelen usar como referencia. Reducirlo puede ayudar a cuidar la presión arterial.']
    : ['✅','Sodio dentro de la referencia: '+Math.round(t.so)+' mg.']);
  v.push(t.fi<R.fi
    ? ['🥬','Fibra: llevas '+Math.round(t.fi)+' g de los '+R.fi+' g recomendados. Legumbres, frutas enteras y granos integrales la suben fácil.']
    : ['✅','Buena fibra: '+Math.round(t.fi)+' g.']);
  const plan=perfil?calcularPlan(perfil):null;
  if(plan)v.push(t.p<plan.prot*0.8
    ? ['🍗','Proteína: '+Math.round(t.p)+' g de '+plan.prot+' g. Repartirla entre las comidas ayuda a mantener el músculo que ganas entrenando.']
    : ['✅','Proteína cumplida: '+Math.round(t.p)+' g de '+plan.prot+' g.']);
  v.push(['💬','Un día por encima de las referencias no cambia nada. Lo que cuenta es cómo comes la mayoría de los días.']);
  return v;
};

/* ---------- redactor automático, revisado ---------- */
explicarAlimento=function(n,nom){
  const f=[];
  if(n.p>=20)f.push('Aporta bastante proteína (unos '+Math.round(n.p)+' g), útil para mantener y reparar el músculo');
  else if(n.p>=10)f.push('Tiene una cantidad decente de proteína (unos '+Math.round(n.p)+' g)');
  if(n.fi>=5)f.push('sus '+Math.round(n.fi)+' g de fibra ayudan a la saciedad y al tránsito intestinal');
  else if(n.fi>=3)f.push('aporta algo de fibra');
  const bueno=f.length?f.join(' y ')+'. ':'';
  const m=[];
  if(n.sat>=8)m.push('La grasa saturada es alta (unos '+n.sat.toFixed(1)+' g); consumirla en exceso de forma habitual puede elevar el colesterol LDL en algunas personas');
  else if(n.sat>=5)m.push('La grasa saturada es notable (unos '+n.sat.toFixed(1)+' g), así que conviene moderar la frecuencia');
  if(n.az>=20)m.push('Aporta bastante azúcar (unos '+Math.round(n.az)+' g), que sacia poco para las calorías que suma');
  else if(n.az>=10)m.push('El azúcar es notable (unos '+Math.round(n.az)+' g)');
  if(n.so>=800)m.push('El sodio es elevado (unos '+Math.round(n.so)+' mg); moderarlo puede ayudar a cuidar la presión arterial');
  else if(n.so>=400)m.push('Tiene bastante sodio (unos '+Math.round(n.so)+' mg)');
  if(n.k>=400&&n.p<10&&n.fi<3)m.push('Aporta bastantes calorías para lo poco que sacia');
  const malo=m.length?m.join('. ')+'. ':'';
  const niv=nivelPor100(n);
  const cierre=niv===3?'En conjunto encaja bien como parte habitual de la alimentación.'
    :niv===2?'Encaja sin problema cuidando la cantidad y la frecuencia.'
    :'Funciona mejor como algo ocasional, sin que haga falta eliminarlo.';
  return ((bueno+malo)||'Los valores son moderados, sin nada que destaque particularmente. ')+cierre+
    ' Los valores son aproximados y varían según la preparación.';
};

function analizarPlato(txt){
  const t=txt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const usados=new Set(),partes=[];
  COMPONENTES.forEach(([clave,nombre,mult])=>{
    const k=clave.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(!t.includes(k)||usados.has(nombre))return;
    const a=ALIM.find(x=>x[0]===nombre);
    if(!a)return;
    usados.add(nombre);partes.push({a:a,m:mult});
  });
  if(partes.length<2)return null;
  const s=[0,0,0,0,0,0,0,0];
  partes.forEach(({a,m})=>{for(let i=0;i<8;i++)s[i]+=(a[i+2]||0)*m});
  const n={k:s[0],p:s[1],c:s[2],g:s[3],sat:s[4],az:s[5],so:s[6],fi:s[7]};
  const niv=nivelPor100(n);
  const lista=partes.map(({a,m})=>a[0].toLowerCase()+(m!==1?' ('+m+' porciones)':'')).join(', ');
  return [txt.trim().charAt(0).toUpperCase()+txt.trim().slice(1),'1 plato estimado',
    Math.round(s[0]),+s[1].toFixed(1),+s[2].toFixed(1),+s[3].toFixed(1),+s[4].toFixed(1),
    +s[5].toFixed(1),Math.round(s[6]),+s[7].toFixed(1),niv,
    'Estimación hecha sumando: '+lista+'. Como no sabemos las cantidades exactas de tu plato, usamos porciones estándar. '+explicarAlimento(n,txt),''];
}
const analPrev=abrirAnalizar;
abrirAnalizar=function(){
  analPrev();
  const c=$('#infoCuerpo');
  const inp=c.querySelector('.buscar');if(!inp)return;
  const zona=el('div');
  inp.insertAdjacentElement('afterend',zona);
  const origIn=inp.oninput;
  let t=null;
  inp.oninput=e=>{
    origIn&&origIn.call(inp,e);

    t=setTimeout(()=>{
      zona.innerHTML='';

      b.style.color='#fff';
      b.innerHTML='<span style="font-size:20px">🍽</span><div class="crece"><b style="color:#fff">'+plato[0]+'</b>'+

        '<div class="kcal" style="color:#fff!important">→</div>';
      b.onclick=()=>pedirCantidad(plato);
      zona.appendChild(b);
    },500);
  };
};

function objetivosDe(obj){
  const base=perfil?calcularPlan(perfil):{kcal:2000,prot:120};
  const peso=perfil?perfil.peso:70;
  const o=OBJ.find(x=>x.id===obj)||OBJ[1];
  let kcal=Math.round(base.tdee?base.tdee*o.ajK:base.kcal*o.ajK);
  const piso=perfil&&perfil.sexo==='m'?1200:1500;
  let ajustado=false;
  if(kcal<piso){kcal=piso;ajustado=true}
  const prot=Math.round(peso*o.prot);
  const gras=Math.round(peso*o.gras);
  const carb=Math.max(50,Math.round((kcal-prot*4-gras*9)/4));
  const fi=kcal>=2200?30:25;
  return {kcal,prot,gras,carb,fi,sat:Math.round(kcal*0.1/9),so:2300,o,ajustado,piso};
}

  const o=OBJ.find(x=>x.id===objId);
  (o?o.pref:[]).forEach(t=>{if(r.t.includes(t))s+=2.5});
  Object.keys(est.peso||{}).forEach(t=>{if(r.t.includes(t))s+=est.peso[t]});
  s+=(r.p/Math.max(1,r.k))*40;                    // densidad de proteína
  s+=(r.fi/Math.max(1,r.k))*120;                  // densidad de fibra
  if(r.sat>8)s-=1.5;
  if(r.so>800)s-=1;
  if(prefDieta.si.includes(r.id))s+=4;
  return s;
}
function generarPlan(objId,dias,nComidas,estId,semilla){
  const meta=objetivosDe(objId);
  const est=ESTILOS.find(e=>e.id===estId)||ESTILOS[3];
  const rep=REPARTO[nComidas]||REPARTO[4];
  const slots=Object.keys(rep);
  const disp={};
  slots.forEach(s=>{
    let l=REC.filter(r=>r.s===s&&!prefDieta.no.includes(r.id));
    if(!l.length)l=REC.filter(r=>r.s===s);
    l=l.map(r=>({r:r,p:puntuar(r,meta,est,objId)})).sort((a,b)=>b.p-a.p).map(x=>x.r);
    disp[s]=l;
  });
  const plan={obj:objId,est:estId,dias:dias,nComidas:nComidas,meta:meta,creado:Date.now(),d:[]};
  for(let d=0;d<dias;d++){
    const dia={comidas:[]};
    slots.forEach((s,si)=>{
      const l=disp[s];
      let idx;
      if(est.repetir)idx=(si+semilla)%Math.min(2,l.length);
      else if(est.variar)idx=(d+si+semilla)%l.length;
      else idx=(d*1+semilla+si)%Math.min(l.length,Math.max(3,Math.ceil(l.length*0.6)));
      const r=l[idx]||l[0];
      const objetivoK=meta.kcal*rep[s];
      let f=objetivoK/r.k;
      f=Math.max(0.6,Math.min(1.8,Math.round(f*4)/4));
      dia.comidas.push({s:s,id:r.id,f:f});
    });
    plan.d.push(dia);
  }
  return plan;
}
function nutriComida(c){
  const r=REC.find(x=>x.id===c.id);if(!r)return null;
  const f=c.f||1;
  return {n:r.n,r:r,f:f,k:Math.round(r.k*f),p:Math.round(r.p*f),c:Math.round(r.c*f),
    g:Math.round(r.g*f),sat:+(r.sat*f).toFixed(1),fi:Math.round(r.fi*f),so:Math.round(r.so*f)};
}
function totalDiaPlan(dia){
  const t={k:0,p:0,c:0,g:0,sat:0,fi:0,so:0};
  dia.comidas.forEach(c=>{const n=nutriComida(c);if(!n)return;
    t.k+=n.k;t.p+=n.p;t.c+=n.c;t.g+=n.g;t.sat+=n.sat;t.fi+=n.fi;t.so+=n.so});
  t.sat=+t.sat.toFixed(1);
  return t;
}
/* alternativas nutricionalmente parecidas */
function alternativas(id){
  const r=REC.find(x=>x.id===id);if(!r)return [];
  return REC.filter(x=>x.s===r.s&&x.id!==id&&!prefDieta.no.includes(x.id))
    .map(x=>({r:x,d:Math.abs(x.k-r.k)/r.k*2+Math.abs(x.p-r.p)/Math.max(1,r.p)}))
    .sort((a,b)=>a.d-b.d).map(x=>x.r).slice(0,6);
}
/* lista de compras */
function listaCompras(plan){
  const acum={};
  plan.d.forEach(dia=>dia.comidas.forEach(c=>{
    const r=REC.find(x=>x.id===c.id);if(!r)return;
    r.ing.forEach(s=>{
      const [nom,cant,cat]=s.split('|');
      const m=cant.match(/^([\d.,½¼¾]+)\s*(.*)$/);
      let num=1,uni=cant;
      if(m){
        num=m[1]==='½'?0.5:m[1]==='¼'?0.25:m[1]==='¾'?0.75:parseFloat(m[1].replace(',','.'))||1;
        uni=m[2]||'';
      }
      const k=cat+'|'+nom+'|'+uni;
      acum[k]=(acum[k]||0)+num*(c.f||1);
    });
  }));
  const out={};
  Object.keys(acum).forEach(k=>{
    const [cat,nom,uni]=k.split('|');
    let v=acum[k];
    v=v>=10?Math.round(v):Math.round(v*2)/2;
    (out[cat]=out[cat]||[]).push({nom:nom,cant:v+(uni?' '+uni:'')});
  });
  Object.keys(out).forEach(c=>out[c].sort((a,b)=>a.nom.localeCompare(b.nom,'es')));
  return out;
}
/* qué comer con lo que te queda */
function sugerirComidas(restK,restP){
  return REC.map(r=>({r:r,
    d:Math.abs(r.k-restK)/Math.max(100,restK)+(restP>0?Math.max(0,restP-r.p)/Math.max(1,restP):0)}))
   .filter(x=>x.r.k<=restK*1.25&&!prefDieta.no.includes(x.r.id))
   .sort((a,b)=>a.d-b.d).slice(0,4).map(x=>x.r);
}

      if(!prefDieta.no.includes(cm.id))prefDieta.no.push(cm.id);
      prefDieta.si=prefDieta.si.filter(x=>x!==cm.id);

      const alt=alternativas(cm.id)[0];
      if(alt){cm.id=alt.id;cm.f=Math.max(0.6,Math.min(1.8,Math.round((plan.meta.kcal*(REPARTO[plan.nComidas]||REPARTO[4])[cm.s]/alt.k)*4)/4));}
      if(guardado)grabar(KDT.plan,plan);

      verPlan(plan,guardado);

    c.appendChild(q);

}
function cambiarComida(plan,d,i,guardado){

  alternativas(cm.id).forEach(r=>{
    const rep=(REPARTO[plan.nComidas]||REPARTO[4])[cm.s];
    const f=Math.max(0.6,Math.min(1.8,Math.round((plan.meta.kcal*rep/r.k)*4)/4));
    const b=el('button','plan-op');
    b.innerHTML='<b>'+r.n+'</b><div class="mini"><span><i>'+Math.round(r.k*f)+'</i> kcal</span>'+
      '<span><i>'+Math.round(r.p*f)+'</i> g prot</span><span><i>'+Math.round(r.fi*f)+'</i> g fibra</span></div>';
    b.onclick=()=>{cm.id=r.id;cm.f=f;if(guardado)grabar(KDT.plan,plan);verPlan(plan,guardado)};
    c.appendChild(b);

function verLista(plan){

  const l=listaCompras(plan);
  Object.keys(CATS).forEach(cat=>{
    if(!l[cat])return;
    const cj=el('div','lista-cat','<h4>'+CATS[cat][0]+'  '+CATS[cat][1]+'</h4>');
    l[cat].forEach(it=>{
      const f=el('div','lista-item','<span class="ck"></span><b>'+it.nom+'</b><small>'+it.cant+'</small>');
      f.onclick=()=>f.classList.toggle('on');
      cj.appendChild(f);

    c.appendChild(cj);
  });
  const cp=el('button','btn fantasma','Copiar la lista');
  cp.onclick=()=>{
    let txt='LISTA DE COMPRAS — '+plan.dias+' días\n';
    Object.keys(CATS).forEach(cat=>{
      if(!l[cat])return;
      txt+='\n'+CATS[cat][1].toUpperCase()+'\n';
      l[cat].forEach(it=>txt+='- '+it.nom+': '+it.cant+'\n');
    });
    navigator.clipboard&&navigator.clipboard.writeText(txt);avisar('Lista copiada');
  };
  c.appendChild(cp);
  const v=el('button','btn','Volver al plan');
  v.onclick=()=>verPlan(plan,planDieta&&planDieta.creado===plan.creado);
  c.appendChild(v);
  abrir('#capaInfo');
}

<script>

   MÓDULO 16D — integración con el registro diario
   ========================================================= */
/* si hay plan activo, sus metas mandan sobre el cálculo base */
const planPrev16=calcularPlan;
calcularPlan=function(pf){
  const base=planPrev16(pf);
  if(planDieta&&planDieta.meta){
    const m=planDieta.meta;
    return Object.assign({},base,{kcal:m.kcal,prot:m.prot,carb:m.carb,gras:m.gras,dePlan:true});
  }
  return base;
};

const dietaPrev16=pintarDieta;
pintarDieta=function(){
  dietaPrev16();
  const v=$('#v-dieta');

  /* tarjeta de acceso a Crea tu dieta */
  const b=el('button','guia-btn');

  if(ref)v.insertBefore(b,ref);else v.appendChild(b);

  if(!perfil&&!planDieta)return;
  const plan=calcularPlan(perfil||{sexo:'h',edad:30,peso:70,altura:170,actividad:'lig',meta:'mantener'});
  const t=totalDia(hoyClave());
  const restK=Math.round(plan.kcal-t.kcal),restP=Math.round(plan.prot-t.p);
  const caja=el('div','dr');
  caja.innerHTML='<h4>🎯 Frente a tu objetivo</h4>'+
